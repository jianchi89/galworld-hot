    root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === activeTab));
    root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${activeTab}`));
    if (activeTab === 'map' && window.initEmbeddedMap) window.initEmbeddedMap();
    restoreScrolls(root);
  }

  function pad(n) { return String(n).padStart(3, '0'); }

  let calViewYear = 2018;
  let calViewMonth = 4;
  let calSelectedDate = '';
  let calSubMode = 'calendar';
  let calInitedPlotDate = '';

  function parseYMD(str, fallbackYear) {
    const s = String(str || '');
    let m = s.match(/(\d{4})\s*[年\-/.]\s*(\d{1,2})\s*[月\-/.]\s*(\d{1,2})/);
    if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
    m = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
    if (m) return { y: fallbackYear || 2018, m: parseInt(m[1]), d: parseInt(m[2]) };
    return null;
  }

  function fmtYMD(y, m, d) {
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function getWeekdayCN(y, m, d) {
    return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date(y, m - 1, d).getDay()];
  }

  function renderCalendarPane(root, sd, events, evKeys) {
    const destinyStage = root.querySelector('#destiny-stage');
    if (!destinyStage) return;

    const rawWorldDate = String(safeGet(sd, '世界.日期', '2018年4月9日 星期一'));
    const plotParsed = parseYMD(rawWorldDate, 2018) || { y: 2018, m: 4, d: 9 };
    const plotKey = fmtYMD(plotParsed.y, plotParsed.m, plotParsed.d);

    if (calInitedPlotDate !== plotKey) {
      calInitedPlotDate = plotKey;
      calViewYear = plotParsed.y;
      calViewMonth = plotParsed.m;
      calSelectedDate = plotKey;
    }

    const calObj = safeGet(sd, '世界.日历', {}) || {};
    const calKeys = Object.keys(calObj);

    const dayMap = {};
    const allMonthItems = [];
    const addDayItem = (ymd, item) => {
      if (!dayMap[ymd]) dayMap[ymd] = [];
      dayMap[ymd].push({ ymd, ...item });
      allMonthItems.push({ ymd, ...item });
    };

    addDayItem(fmtYMD(calViewYear, calViewMonth, 20), {
      title: '跨学院社团交流日', status: '校历固定', dateStr: `${calViewMonth}月20日`,
      desc: '云下学园每月20号固定举办的跨子校园社团联合展示与招新交流日。',
      who: '全校社团', pillCls: 'p-school', kind: 'school'
    });

    calKeys.forEach(id => {
      const c = calObj[id] || {};
      const p = parseYMD(c['日期'], calViewYear);
      if (!p) return;
      addDayItem(fmtYMD(p.y, p.m, p.d), {
        id, path: `世界.日历.${id}`,
        title: c['标题'] || id,
        status: c['类型'] || c['状态'] || '日常',
        dateStr: `${p.m}月${p.d}日`,
        desc: c['简述'] || '',
        who: c['相关者'] ? `${c['相关者']}${c['地点'] ? ' · '+c['地点'] : ''}` : (c['地点'] || '都市动态'),
        pillCls: 'p-cal', kind: 'cal'
      });
    });

    const fateList = [];
    evKeys.forEach(name => {
      const ev = events[name] || {};
      const p = parseYMD(ev['期限'] || ev['阶段'], calViewYear);
      if (p && ev['类型'] !== '命运') {
        addDayItem(fmtYMD(p.y, p.m, p.d), {
          id: name, path: `世界.事件.${name}`,
          title: name,
          status: ev['状态'] || '进行中',
          dateStr: `${p.m}月${p.d}日`,
          desc: ev['内容'] || ev['阶段目标'] || '',
          who: ev['相关者'] || '未指定',
          pillCls: 'p-promise', kind: 'event'
        });
      } else {
        fateList.push({ name, ev });
      }
    });

    root.querySelector('.event-count-badge').textContent = evKeys.length + calKeys.length;

    const firstDayWeek = new Date(calViewYear, calViewMonth - 1, 1).getDay();
    const daysInMonth = new Date(calViewYear, calViewMonth, 0).getDate();
    const prevMonthDays = new Date(calViewYear, calViewMonth - 1, 0).getDate();
    const EN_MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

    let cellsHtml = '';
    for (let i = 0; i < firstDayWeek; i++) {
      cellsHtml += `<div class="gw-cal-cell is-other"><span class="gw-cal-daynum">${prevMonthDays - firstDayWeek + 1 + i}</span></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const ymd = fmtYMD(calViewYear, calViewMonth, d);
      const wk = new Date(calViewYear, calViewMonth - 1, d).getDay();
      const wkCls = wk === 0 ? 'sun' : (wk === 6 ? 'sat' : '');
      const isToday = (ymd === plotKey);
      const isSel = (ymd === calSelectedDate);
      const items = dayMap[ymd] || [];
      const dots = items.slice(0, 3).map(it => `<i class="gw-cal-dot ${it.pillCls}"></i>`).join('');
      const firstTag = items[0] ? `<div class="gw-cal-mini-tag ${items[0].pillCls}">${escHtml(items[0].title)}</div>` : '';

      cellsHtml += `
        <div class="gw-cal-cell ${wkCls} ${items.length ? 'has-ev' : ''} ${isToday ? 'is-today' : ''} ${isSel ? 'is-selected' : ''}" data-cal-day="${ymd}">
          <div class="gw-cal-cell-top">
            <span class="gw-cal-daynum">${d}</span>
            <div class="gw-cal-dots">${dots}</div>
          </div>
          ${firstTag}
        </div>
      `;
    }
    const remain = (7 - ((firstDayWeek + daysInMonth) % 7)) % 7;
    for (let i = 1; i <= remain; i++) {
      cellsHtml += `<div class="gw-cal-cell is-other"><span class="gw-cal-daynum">${i}</span></div>`;
    }

    const selParts = (calSelectedDate || plotKey).split('-').map(Number);
    const selItems = dayMap[calSelectedDate || plotKey] || [];
    const wkStr = getWeekdayCN(selParts[0], selParts[1], selParts[2]);
    const isSelToday = (calSelectedDate === plotKey);

    const fmtShortDate = (ymd) => {
      const [yy, mm, dd] = (ymd || plotKey).split('-').map(Number);
      return `${mm}月${dd}日 ${getWeekdayCN(yy, mm, dd).replace('星期', '周')}`;
    };

    let rightListHtml = '';
    if (calSubMode === 'fate') {
      rightListHtml = fateList.map(({ name, ev }) => `
        <div class="gw-ticket-card p-fate">
          <div class="gw-tk-body">
            <div class="gw-tk-head">
              <span class="gw-tk-tag">${escHtml(ev['类型'] || '命运')}</span>
              <span class="gw-tk-title">${escHtml(name)}</span>
              <span class="gw-tk-meta">${escHtml(ev['阶段'] || ev['状态'] || '进行中')}</span>
            </div>
            <div class="gw-tk-desc" data-krs-edit="世界.事件.${name}.${ev['阶段目标'] ? '阶段目标' : '内容'}" data-krs-label="${name}" data-krs-type="textarea">${escHtml(ev['阶段目标'] || ev['内容'] || '')}</div>
            <div class="gw-tk-foot">
              <span>相关：<b>${escHtml(ev['相关者'] || ev['角色与任务'] || '主线')}</b></span>
              <button type="button" class="krs-pill" data-del-event="${escHtml(name)}" style="color:var(--muted);padding:1px 7px;">清退</button>
            </div>
          </div>
        </div>
      `).join('') || '<div style="text-align:center;padding:36px 12px;color:var(--muted-2);font-size:11.5px;">暂无长期命运主线记录。</div>';
    } else if (selItems.length > 0) {
      rightListHtml = selItems.map(it => `
        <div class="gw-ticket-card ${it.pillCls}">
          <div class="gw-tk-body">
            <div class="gw-tk-head">
              <span class="gw-tk-tag">${escHtml(it.status)}</span>
              <span class="gw-tk-title">${escHtml(it.title)}</span>
            </div>
            <div class="gw-tk-desc" ${it.path ? `data-krs-edit="${it.path}.${it.kind==='cal'?'简述':'内容'}" data-krs-label="${it.title}" data-krs-type="textarea"` : ''}>${escHtml(it.desc || '暂无详细说明')}</div>
            <div class="gw-tk-foot">
              <span>${escHtml(it.who)}</span>
              ${it.kind === 'event' ? `<button type="button" class="krs-pill" data-del-event="${escHtml(it.id)}" style="color:var(--muted);padding:1px 7px;">清退</button>` : ''}
              ${it.kind === 'cal' ? `<button type="button" class="krs-pill" data-del-cal="${escHtml(it.id)}" style="color:var(--muted);padding:1px 7px;">删除</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    } else {
      const upcoming = allMonthItems.slice(0, 4);
      rightListHtml = `
        <div style="padding:8px 11px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--line-strong);color:var(--muted);font-size:11px;">
          ${selParts[1]}月${selParts[2]}日暂无特定日程。本月近期动态速览：
        </div>
        ${upcoming.map(it => `
          <div class="gw-ticket-card ${it.pillCls}" style="cursor:pointer;" data-cal-day="${it.ymd}">
            <div class="gw-tk-body">
              <div class="gw-tk-head">
                <span class="gw-tk-tag">${escHtml(it.status)}</span>
                <span class="gw-tk-title">${escHtml(it.title)}</span>
                <span class="gw-tk-meta">${escHtml(fmtShortDate(it.ymd))}</span>
              </div>
              <div class="gw-tk-desc">${escHtml(it.desc || '点击跳转到该日')}</div>
              <div class="gw-tk-foot">
                <span>${escHtml(it.who)}</span>
                <span style="font-size:9.5px;opacity:.75;">跳转该日 ➔</span>
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    destinyStage.innerHTML = `
      <div class="gw-cal-left">
        <div class="gw-cal-head">
          <div class="gw-cal-month-title">
            <strong>${calViewYear}年${calViewMonth}月</strong>
            <span>${EN_MONTHS[(calViewMonth - 1) % 12]} · KUMOMI</span>
          </div>
          <div class="gw-cal-controls">
            <button type="button" class="gw-cal-today-btn" data-cal-goto-today="${plotKey}">返回当日</button>
            <button type="button" class="gw-cal-mbtn" data-cal-nav="-1">‹</button>
            <button type="button" class="gw-cal-mbtn" data-cal-nav="1">›</button>
          </div>
        </div>

        <div class="gw-cal-weekdays">
          <span class="sun">SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span class="sat">SAT</span>
        </div>
        <div class="gw-cal-grid">${cellsHtml}</div>

        <div class="gw-cal-legend">
          <div class="gw-cal-legend-dots">
            <span><i class="gw-cal-dot"></i>人物与日常</span>
            <span><i class="gw-cal-dot p-promise"></i>重要约定</span>
            <span><i class="gw-cal-dot p-school"></i>固定校历</span>
          </div>
          <span>共 ${allMonthItems.length} 项日程</span>
        </div>
      </div>

      <div class="gw-cal-right">
        <div class="gw-cr-banner">
          <div class="gw-cr-date-big">
            <span class="gw-cr-day-num ${calSubMode === 'fate' ? 'is-fate' : (isSelToday ? 'is-today' : '')}">
              ${calSubMode === 'fate' ? '✦' : String(selParts[2]).padStart(2,'0')}
            </span>
            <div class="gw-cr-date-meta">
              <b>${calSubMode === 'fate' ? '角色命运与长期主线' : `${selParts[1]}月${selParts[2]}日 · ${wkStr}`}</b>
              <span>${calSubMode === 'fate' ? 'HEROINE DESTINY ROUTES' : (isSelToday ? '✦ 当前剧情所在日 (TODAY)' : `SELECTED DATE · 共 ${selItems.length} 项安排`)}</span>
            </div>
          </div>
          <button type="button" class="gw-cal-today-btn" data-cal-mode="${calSubMode === 'fate' ? 'calendar' : 'fate'}">
            ${calSubMode === 'fate' ? '当日手账' : `✦ 命运 (${fateList.length})`}
          </button>
        </div>

        <div class="gw-cr-scroll">${rightListHtml}</div>
      </div>
    `;
  }

  /* ═══ 图鉴弹窗（按作品分类 → 角色与本作CG → 角色专属CG与立绘 + 全屏大图灯箱） ═══ */
  function openCgGalleryModal(targetCharName) {
    const matched = targetCharName ? findCastEntry(targetCharName) : null;
    let currentChar = matched ? matched.fullName : null;
    let currentWork = matched ? (matched.work || null) : null;
    let currentView = currentChar ? 'char' : 'works'; // 'works' | 'work' | 'char'
    let workFilter = 'all'; // 'all' | 'cg' | 'nocg'
    let workTab = 'chars';  // 'chars' | 'cgs'
    let charTab = 'all';    // 'all' | 'cgs' | 'sprites'
    let searchQuery = '';

    /* 汇总全部作品、角色与 CG 目录 */
    const allCharNames = Object.keys(CAST_ART);
    const workMap = new Map();
    _W.forEach(w => workMap.set(w, { name: w, chars: [], cgCount: 0, cover: WORK_COVERS[w] || '' }));
    allCharNames.forEach(n => {
      const item = CAST_ART[n];
      const w = item.work || '其他作品';
      if (!workMap.has(w)) workMap.set(w, { name: w, chars: [], cgCount: 0, cover: WORK_COVERS[w] || '' });
      const entry = workMap.get(w);
      entry.chars.push(n);
      entry.cgCount += (item.cgs || []).length;
    });
    const worksList = Array.from(workMap.values()).filter(w => w.chars.length > 0);
    worksList.forEach(w => {
      /* 作品内有 CG 的角色排在前面 */
      w.chars.sort((a, b) => {
        const ac = (CAST_ART[a].cgs || []).length > 0 ? 1 : 0;
        const bc = (CAST_ART[b].cgs || []).length > 0 ? 1 : 0;
        return bc - ac;
      });
      if (!w.cover && w.chars.length) {
        const first = CAST_ART[w.chars[0]];
        w.cover = getDefaultStage(first) || first.normal || FALLBACK_IMG;
      }
    });
    const totalCgCount = worksList.reduce((s, w) => s + w.cgCount, 0);
    const cgWorksList = worksList.filter(w => w.cgCount > 0);
    const noCgWorksList = worksList.filter(w => w.cgCount === 0);

    let modal = document.getElementById('krs-cg-modal-root');
    if (modal) modal.remove();
    modal = document.createElement('div');
    modal.id = 'krs-cg-modal-root';
    modal.className = 'krs-cg-modal-backdrop';
    try {
      if (document.querySelector('.krs-status-root.krs-dark')) modal.classList.add('krs-cg-dark');
    } catch (_) {}

    modal.innerHTML = `
      <div class="krs-cg-window krs-cg-gallery-win">
        <div class="krs-cg-topbar" id="krs-cg-topbar"></div>
        <div class="krs-cg-toolbar" id="krs-cg-toolbar"></div>
        <div class="krs-cg-body" id="krs-cg-body"></div>
      </div>
      <div class="krs-cg-lightbox" id="krs-cg-lightbox" style="display:none;"></div>
    `;

    const topbarEl = modal.querySelector('#krs-cg-topbar');
    const toolbarEl = modal.querySelector('#krs-cg-toolbar');
    const bodyEl = modal.querySelector('#krs-cg-body');
    const lbEl = modal.querySelector('#krs-cg-lightbox');

    /* 灯箱状态与图片池 */
    let lbPools = {};
    let lbItems = [];
    let lbIdx = 0;
    let lbOpen = false;
    let lbTouchX = 0, lbTouchY = 0;

    function renderLightbox() {
      if (!lbOpen || !lbItems.length) {
        lbEl.style.display = 'none';
        lbEl.innerHTML = '';
        return;
      }
      const cur = lbItems[lbIdx];
      const hasMulti = lbItems.length > 1;
      lbEl.style.display = 'flex';
      lbEl.innerHTML = `
        <div class="krs-lb-stage">
          ${hasMulti ? `<button type="button" class="krs-lb-nav krs-lb-prev" data-lb-step="-1" title="上一张">‹</button>` : ''}
          <img class="krs-lb-img" src="${escHtml(cur.url)}" alt="${escHtml(cur.title)}">
          ${hasMulti ? `<button type="button" class="krs-lb-nav krs-lb-next" data-lb-step="1" title="下一张">›</button>` : ''}
        </div>
        <div class="krs-lb-bar">
          <div><b>${escHtml(cur.title)}</b>${cur.sub ? ` <span style="opacity:.7;font-size:12px;">· ${escHtml(cur.sub)}</span>` : ''} <span style="opacity:.65;margin-left:6px;">(${lbIdx + 1} / ${lbItems.length})</span></div>
          <div class="krs-lb-actions">
            <a class="krs-lb-btn" href="${escHtml(cur.url)}" target="_blank" rel="noopener noreferrer">↗ 原图</a>
            <button type="button" class="krs-lb-btn" id="krs-lb-close">关闭 ×</button>
          </div>
        </div>
      `;
    }

    function openLightbox(items, idx) {
      if (!items || !items.length) return;
      lbItems = items;
      lbIdx = Math.max(0, Math.min(items.length - 1, idx || 0));
      lbOpen = true;
      renderLightbox();
    }

    function stepLightbox(dir) {
      if (!lbOpen || lbItems.length <= 1) return;
      lbIdx = (lbIdx + dir + lbItems.length) % lbItems.length;
      renderLightbox();
    }

    function closeLightbox() {
      lbOpen = false;
      renderLightbox();
    }

    function onKeyDown(e) {
      if (lbOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); stepLightbox(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeModal();
      }
    }

    function closeModal() {
      document.removeEventListener('keydown', onKeyDown);
      modal.remove();
    }
    document.addEventListener('keydown', onKeyDown);

    function renderWorkCard(w) {
      const hasCg = w.cgCount > 0;
      return `
        <div class="krs-cg-work-card ${hasCg ? 'has-cg' : ''}" data-cg-work="${escHtml(w.name)}">
          <div class="krs-cg-work-cover-wrap">
            <img class="krs-cg-work-cover" loading="lazy" decoding="async" src="${escHtml(w.cover)}" alt="${escHtml(w.name)}" data-fb="${escHtml(JSON.stringify([rawUrlOf(w.cover)]))}" onerror="window.__krsImgFb(this)">
            <span class="krs-cg-badge-corner ${hasCg ? 'hot' : ''}">${hasCg ? `🎬 ${w.cgCount} CG` : '👗 立绘'}</span>
          </div>
          <div class="krs-cg-work-info">
            <div class="krs-cg-work-name" title="${escHtml(w.name)}">${escHtml(w.name)}</div>
            <div class="krs-cg-work-sub">
              <span>👤 ${w.chars.length} 位角色</span>
              <span>${hasCg ? `含 ${w.chars.filter(n => (CAST_ART[n].cgs || []).length > 0).length} 人专属CG` : '暂未收录CG'}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderCharCard(n, showWork) {
      const item = CAST_ART[n] || {};
      const coverUrl = getDefaultStage(item) || item.normal || FALLBACK_IMG;
      const cgLen = (item.cgs || []).length;
      const outfitLen = Object.keys(item.outfits || {}).length + (item.normal ? 1 : 0);
      return `
        <div class="krs-cg-album-card ${cgLen ? 'has-cg' : ''}" data-cg-char="${escHtml(n)}">
          ${cgLen ? `<span class="krs-cg-badge-corner hot">🎬 ${cgLen} CG</span>` : ''}
          <img class="krs-cg-album-cover" loading="lazy" decoding="async" src="${escHtml(coverUrl)}" alt="${escHtml(n)}" data-fb="${escHtml(JSON.stringify([rawUrlOf(coverUrl)]))}" onerror="window.__krsImgFb(this)">
          <div class="krs-cg-album-info">
            <span title="${escHtml(n)}">${escHtml(n)}</span>
            <span class="krs-cg-album-sub">${showWork ? escHtml(item.work || '') : `👗${outfitLen}`}</span>
          </div>
        </div>
      `;
    }

    function renderWorksBody() {
      const q = searchQuery.trim().toLowerCase();
      if (q) {
        const hitWorks = worksList.filter(w => w.name.toLowerCase().includes(q));
        const hitChars = allCharNames.filter(n => n.toLowerCase().includes(q));
        let html = '';
        if (hitWorks.length) {
          html += `<div class="krs-cg-sec-title">◆ 匹配作品 (${hitWorks.length})</div><div class="krs-cg-works-grid">${hitWorks.map(renderWorkCard).join('')}</div>`;
        }
        if (hitChars.length) {
          html += `<div class="krs-cg-sec-title">◆ 匹配角色 (${hitChars.length})</div><div class="krs-cg-albums-grid">${hitChars.map(n => renderCharCard(n, true)).join('')}</div>`;
        }
        bodyEl.innerHTML = html || `<div style="text-align:center;padding:48px 16px;color:var(--cg-muted);">未找到与「${escHtml(searchQuery)}」相关的作品或角色。</div>`;
        return;
      }

      if (workFilter === 'cg') {
        bodyEl.innerHTML = `<div class="krs-cg-sec-title">◆ 已收录专属CG作品 (${cgWorksList.length} 部 · ${totalCgCount} 张CG)</div><div class="krs-cg-works-grid">${cgWorksList.map(renderWorkCard).join('')}</div>`;
      } else if (workFilter === 'nocg') {
        bodyEl.innerHTML = `<div class="krs-cg-sec-title">◆ 角色立绘档案 (${noCgWorksList.length} 部)</div><div class="krs-cg-works-grid">${noCgWorksList.map(renderWorkCard).join('')}</div>`;
      } else {
        bodyEl.innerHTML = `
          ${cgWorksList.length ? `<div class="krs-cg-sec-title">◆ 已收录专属CG作品 (${cgWorksList.length} 部 · ${totalCgCount} 张CG)</div><div class="krs-cg-works-grid">${cgWorksList.map(renderWorkCard).join('')}</div>` : ''}
          ${noCgWorksList.length ? `<div class="krs-cg-sec-title">◆ 角色立绘档案 (${noCgWorksList.length} 部)</div><div class="krs-cg-works-grid">${noCgWorksList.map(renderWorkCard).join('')}</div>` : ''}
        `;
      }
    }

    function renderModal() {
      lbPools = {};
      bodyEl.scrollTop = 0;

      if (currentView === 'works') {
        topbarEl.innerHTML = `
          <div class="krs-cg-top-title">
            <span>🖼️ GALWORLD · 作品与CG图鉴</span>
            <span style="font-size:11.5px;font-weight:500;color:var(--cg-muted);">(${worksList.length}部作品 · ${allCharNames.length}人 · ${totalCgCount}张CG)</span>
          </div>
          <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
        `;
        toolbarEl.innerHTML = `
          <div class="krs-cg-tabs">
            <button type="button" class="krs-cg-tab-pill ${workFilter === 'all' ? 'active' : ''}" data-cg-wfilter="all">全部作品 (${worksList.length})</button>
            <button type="button" class="krs-cg-tab-pill ${workFilter === 'cg' ? 'active' : ''}" data-cg-wfilter="cg">🎬 含CG作品 (${cgWorksList.length})</button>
            <button type="button" class="krs-cg-tab-pill ${workFilter === 'nocg' ? 'active' : ''}" data-cg-wfilter="nocg">👗 仅立绘 (${noCgWorksList.length})</button>
          </div>
          <input type="search" class="krs-cg-search" id="krs-cg-search-input" placeholder="🔍 搜索作品或角色名..." value="${escHtml(searchQuery)}">
        `;
        renderWorksBody();
        return;
      }

      if (currentView === 'work') {
        const wObj = workMap.get(currentWork) || worksList[0];
        if (!wObj) { currentView = 'works'; renderModal(); return; }
        const hasWorkCgs = wObj.cgCount > 0;
        if (!hasWorkCgs) workTab = 'chars';

        topbarEl.innerHTML = `
          <div class="krs-cg-top-title">
            <button type="button" class="krs-cg-back-btn" data-cg-go="works">‹ 全部作品</button>
            <span>《${escHtml(wObj.name)}》</span>
            <span style="font-size:11.5px;font-weight:500;color:var(--cg-muted);">(${wObj.chars.length}位角色${hasWorkCgs ? ` · ${wObj.cgCount}张CG` : ''})</span>
          </div>
          <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
        `;

        toolbarEl.innerHTML = hasWorkCgs ? `
          <div class="krs-cg-tabs">
            <button type="button" class="krs-cg-tab-pill ${workTab === 'chars' ? 'active' : ''}" data-cg-wtab="chars">👤 作品角色 (${wObj.chars.length})</button>
            <button type="button" class="krs-cg-tab-pill ${workTab === 'cgs' ? 'active' : ''}" data-cg-wtab="cgs">🎬 本作全部CG (${wObj.cgCount})</button>
          </div>
          <span style="font-size:11px;color:var(--cg-muted);">点击角色查看专属CG与服装，点击CG可全屏浏览</span>
        ` : '';

        if (workTab === 'chars') {
          bodyEl.innerHTML = `<div class="krs-cg-albums-grid">${wObj.chars.map(n => renderCharCard(n, false)).join('')}</div>`;
        } else {
          const allWorkCgs = [];
          let groupsHtml = '';
          wObj.chars.forEach(cName => {
            const cItem = CAST_ART[cName];
            const cgs = (cItem && cItem.cgs) || [];
if (!cgs.length) return;
            const avaUrl = getAvatar(cName);
            const cardsHtml = cgs.map((url, idx) => {
              const poolIdx = allWorkCgs.length;
              const num = String(idx + 1).padStart(2, '0');
              allWorkCgs.push({ url, title: `${cName} · CG${num}`, sub: wObj.name });
              return `
                <div class="krs-cg-cg-card" data-lb-group="work-cgs" data-lb-idx="${poolIdx}">
                  <img class="krs-cg-cg-thumb" loading="lazy" decoding="async" src="${escHtml(url)}" alt="${escHtml(cName)} CG${num}">
                  <div class="krs-cg-cg-cap"><span>CG ${num}</span><small>点击大图</small></div>
                </div>
              `;
            }).join('');
            groupsHtml += `
              <div class="krs-cg-group-head">
                <div class="krs-cg-group-left">
                  <img class="krs-cg-group-ava" loading="lazy" src="${escHtml(avaUrl)}" alt="${escHtml(cName)}" data-fb="${escHtml(JSON.stringify([rawUrlOf(avaUrl)]))}" onerror="window.__krsImgFb(this)">
                  <span>${escHtml(cName)}</span>
                  <span style="font-size:11px;font-weight:500;color:var(--cg-muted);">(${cgs.length} 张CG)</span>
                </div>
                <button type="button" class="krs-cg-back-btn" data-cg-char="${escHtml(cName)}">查看立绘与衣装 ➔</button>
              </div>
              <div class="krs-cg-cg-grid">${cardsHtml}</div>
            `;
          });
          lbPools['work-cgs'] = allWorkCgs;
          bodyEl.innerHTML = groupsHtml || `<div style="text-align:center;padding:48px 16px;color:var(--cg-muted);">该作品暂未收录CG。</div>`;
        }
        return;
      }

      /* 角色详情页：专属CG（置顶展示）+ 立绘与服装 */
      const item = CAST_ART[currentChar] || {};
      const workName = item.work || currentWork || 'GALWORLD';
      const cgs = item.cgs || [];
      const outfitEntries = Object.entries(item.outfits || {});
      const spriteCards = [
        ...outfitEntries.map(([label, url]) => ({ label, url })),
        ...(item.normal ? [{ label: '头像 / 常态立绘', url: item.normal }] : [])
      ];
      if (!cgs.length) charTab = 'sprites';

      lbPools['char-cgs'] = cgs.map((url, idx) => ({
        url,
        title: `${currentChar} · CG${String(idx + 1).padStart(2, '0')}`,
        sub: workName
      }));
      lbPools['char-sprites'] = spriteCards.map(g => ({
        url: g.url,
        title: `${currentChar} · ${g.label}`,
        sub: workName
      }));

      topbarEl.innerHTML = `
        <div class="krs-cg-top-title">
          ${workMap.has(workName) ? `<button type="button" class="krs-cg-back-btn" data-cg-work="${escHtml(workName)}">‹ 《${escHtml(workName)}》</button>` : ''}
          <button type="button" class="krs-cg-back-btn" data-cg-go="works">全部作品</button>
          <span>${escHtml(currentChar)}</span>
        </div>
        <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
      `;

      toolbarEl.innerHTML = cgs.length ? `
        <div class="krs-cg-tabs">
          <button type="button" class="krs-cg-tab-pill ${charTab === 'all' ? 'active' : ''}" data-cg-ctab="all">全部 (${cgs.length + spriteCards.length})</button>
          <button type="button" class="krs-cg-tab-pill ${charTab === 'cgs' ? 'active' : ''}" data-cg-ctab="cgs">🎬 专属CG (${cgs.length})</button>
          <button type="button" class="krs-cg-tab-pill ${charTab === 'sprites' ? 'active' : ''}" data-cg-ctab="sprites">👗 立绘与服装 (${spriteCards.length})</button>
        </div>
        <span style="font-size:11px;color:var(--cg-muted);">点击任意图片全屏查看 · 支持 ← → 键切换</span>
      ` : '';

      const cgSectionHtml = cgs.length ? `
        <div class="krs-cg-sec-title">🎬 ${escHtml(currentChar)} · 专属CG (${cgs.length} 张)</div>
        <div class="krs-cg-cg-grid">
          ${cgs.map((url, idx) => {
            const num = String(idx + 1).padStart(2, '0');
            return `
              <div class="krs-cg-cg-card" data-lb-group="char-cgs" data-lb-idx="${idx}">
                <img class="krs-cg-cg-thumb" loading="lazy" decoding="async" src="${escHtml(url)}" alt="${escHtml(currentChar)} CG${num}">
                <div class="krs-cg-cg-cap"><span>CG ${num}</span><small>点击大图</small></div>
              </div>
            `;
          }).join('')}
        </div>
      ` : '';

      const spriteSectionHtml = `
        <div class="krs-cg-sec-title">👗 立绘与服装 (${spriteCards.length} 套)</div>
        <div class="krs-cg-sprite-grid">
          ${spriteCards.map((g, idx) => `
            <div class="krs-cg-sprite-card" data-lb-group="char-sprites" data-lb-idx="${idx}">
              <img loading="lazy" decoding="async" src="${escHtml(g.url)}" alt="${escHtml(g.label)}" data-fb="${escHtml(JSON.stringify([rawUrlOf(g.url)]))}" onerror="window.__krsImgFb(this)">
              <div class="krs-cg-sprite-lbl">${escHtml(g.label)}</div>
            </div>
          `).join('')}
        </div>
      `;

      if (charTab === 'cgs') bodyEl.innerHTML = cgSectionHtml;
      else if (charTab === 'sprites') bodyEl.innerHTML = spriteSectionHtml;
      else bodyEl.innerHTML = cgSectionHtml + spriteSectionHtml;
    }

    modal.addEventListener('click', (e) => {
      if (lbOpen) {
        if (e.target.closest('a.krs-lb-btn')) return;
        const stepBtn = e.target.closest('[data-lb-step]');
        if (stepBtn) { stepLightbox(parseInt(stepBtn.getAttribute('data-lb-step'), 10) || 1); return; }
        if (e.target === lbEl || e.target.classList.contains('krs-lb-stage') || e.target.closest('#krs-lb-close')) {
          closeLightbox();
        }
        return;
      }
      if (e.target === modal || e.target.closest('#cg-close-btn')) { closeModal(); return; }

      const lbCard = e.target.closest('[data-lb-group]');
      if (lbCard) {
        const group = lbCard.getAttribute('data-lb-group');
        const idx = parseInt(lbCard.getAttribute('data-lb-idx'), 10) || 0;
        openLightbox(lbPools[group] || [], idx);
        return;
      }

      if (e.target.closest('[data-cg-go="works"]')) {
        currentView = 'works'; currentWork = null; currentChar = null;
        renderModal(); return;

        currentView = 'char';
        charTab = 'all';

        workTab = wtBtn.getAttribute('data-cg-wtab');

      }

    lbEl.addEventListener('touchstart', (e) => {

    lbEl.addEventListener('touchend', (e) => {
      if (!lbOpen || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - lbTouchX;
      const dy = e.changedTouches[0].clientY - lbTouchY;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) stepLightbox(dx < 0 ? 1 : -1);

  ];

  const krsPlotRead = { books: 0, entries: 0 };

  function krsPlotChapters(list) {
    return list.map(function (x) { return { stage: x[0], title: x[1] }; });
  }

  function krsEntryLabel(e) {
    if (!e || typeof e !== 'object') return '';
    return String(e.comment || e.name || e.title || e.key || '');
  }

  function krsEntryOn(e) {
    if (!e || typeof e !== 'object') return false;
    if (typeof e.enabled === 'boolean') return e.enabled;
    if (typeof e.disable === 'boolean') return !e.disable;
    return true;
  }

  function krsPlotEntryWith(e, on) {
    const out = Object.assign({}, e);
    out.enabled = !!on;
    out.disable = !on;
    return out;
  }

  async function krsPlotGetEntries(TH) {
    if (!TH || typeof TH.getWorldbook !== 'function') return null;
    const names = await krsPlotAllBookNames(TH);
    if (!names.length) return null;
    const out = [];
    for (let i = 0; i < names.length; i++) {
      try {
        const raw = await Promise.resolve(TH.getWorldbook(names[i]));
        krsFlattenEntries(raw).forEach(function (e) { if (e) out.push(e); });
      } catch (_) {}
    }
    krsPlotRead.books = names.length;
    krsPlotRead.entries = out.length;
    return out.length ? out : null;
  }

  async function krsPlotToggleEntries(prefixes, on) {
    const TH = krsPlotHelper();
    if (!TH || typeof TH.updateWorldbookWith !== 'function') return { ok: false, changed: 0 };
    const names = await krsPlotAllBookNames(TH);
    if (!names.length) return { ok: false, changed: 0 };
    const list = (Array.isArray(prefixes) ? prefixes : [prefixes]).filter(Boolean);
    let ok = false;
    let changed = 0;
    for (let i = 0; i < names.length; i++) {
      const book = names[i];
      try {
        await Promise.resolve(TH.updateWorldbookWith(book, function (entries) {
          return krsFlattenEntries(entries).map(function (e) {
            const c = krsEntryLabel(e);
            const hit = list.some(function (p) { return c.indexOf(p) === 0; });
            if (!hit) return e;
            if (krsEntryOn(e) !== !!on) changed++;
            return krsPlotEntryWith(e, on);
          });
        }));
        ok = true;
      } catch (e) {
        console.warn('[剧情] 世界书条目切换失败：' + book, e);
      }
    }
    return { ok: ok, changed: changed };
  }

  function krsPlotStatusOf(sd, line) {
    const ev = safeGet(sd, line.event, null) || {};
    const status = String(ev.状态 || '');
    const stage = String(ev.阶段 || '');
    return {
      exists: !!(ev && Object.keys(ev).length),
      on: status === '进行中' && stage !== '完结',
      done: status === '达成' || stage === '完结',
      broken: status === '破弃',
      status: status,
      chapter: stage,
      stage: ev.阶段目标 || '',
      next: ev.背景描述 || '',
      content: ev.内容 || ''
    };
  }

  function krsPlotChapterIndex(line, stage) {
    if (!stage) return -1;
    if (stage === '完结') return line.chapters.length;
    for (let i = 0; i < line.chapters.length; i++) {
      if (line.chapters[i].stage === stage) return i;
    }
    for (let i = 0; i < line.chapters.length; i++) {
      const title = line.chapters[i].title;
      if (title.indexOf(stage) === 0 || stage.indexOf(title) === 0) return i;
    }
    for (let i = 0; i < line.chapters.length; i++) {
      if (stage.indexOf(line.chapters[i].stage) === 0) return i;
    }
    return -1;
  }

  function krsPlotChapterTitle(line, stage) {
    if (!stage) return '未选章节';
    if (stage === '完结') return '完结';
    const idx = krsPlotChapterIndex(line, stage);
    return idx >= 0 ? line.chapters[idx].title : stage;
  }

  function krsPlotPatchValue(content, field) {
    const lines = String(content || '').split('\n');
    const suffix = '/' + field;
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      if (!t || t.charAt(0) !== '{') continue;
      try {
        const o = JSON.parse(t);
        if (o && typeof o.path === 'string' && o.path.slice(-suffix.length) === suffix && o.value !== undefined) {
          return String(o.value);
        }
      } catch (_) {}
    }
    return '';
  }

  function krsPlotFindEntry(line, title) {
    const list = line._entries || [];
    const full = String(line.detail || '') + String(title || '');
    for (let i = 0; i < list.length; i++) {
      if (krsEntryLabel(list[i]) === full) return list[i];
    }
    return null;
  }

  function krsPlotOutlineBlock(line, title) {
    const list = line._entries || [];
    const target = String(line.outline || '');
    let outline = null;
    for (let i = 0; i < list.length; i++) {
      if (krsEntryLabel(list[i]) === target) { outline = list[i]; break; }
    }
    if (!outline) return '';
    const lines = String(outline.content || '').split('\n');
    let start = -1;
    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].trim();
      if (t.indexOf(title) === 0) { start = i; break; }
    }
    if (start < 0) return '';
    const out = [];
    for (let i = start + 1; i < lines.length; i++) {
      const t = lines[i].trim();
      if (/^(序章|第[一二三四五六七八九十百]+章|最终章|终章)[：:]/.test(t)) break;
      out.push(lines[i]);
    }
    return out.join('\n');
  }

  function krsPlotPick(block, key) {
    const m = String(block || '').match(new RegExp('^\\s*-\\s*' + key + '[：:]\\s*(.+)$', 'm'));
    return m ? m[1].trim() : '';
  }

  function krsPlotBrief(line, idx) {
    const ch = line.chapters[idx] || {};
    let goal = '';
    let hook = '';
    let content = '';
    if (idx > 0) {
      const prev = line.chapters[idx - 1];
      const e = krsPlotFindEntry(line, prev.title);
      if (e) {
        goal = krsPlotPatchValue(e.content, '阶段目标');
        hook = krsPlotPatchValue(e.content, '背景描述');
        content = krsPlotPatchValue(e.content, '内容');
      }
    }
    if (!goal || !hook) {
      const block = krsPlotOutlineBlock(line, ch.title);
      if (!goal) goal = krsPlotPick(block, '收束');
      if (!hook) hook = krsPlotPick(block, '下一章');
    }
    if (!goal) goal = '等待<user>前往触发：' + (ch.title || ch.stage || '');
    if (!hook) hook = '本章尚未开始；由<user>决定何时进入。';
    if (!content) content = idx === 0 ? ('等待<user>前往触发：' + (ch.title || '')) : ('已进入' + (ch.title || ''));
    return { goal: goal, hook: hook, content: content };
  }

  function krsPlotFinalBrief(line) {
    const last = line.chapters[line.chapters.length - 1] || {};
    const e = krsPlotFindEntry(line, last.title);
    return {
      goal: (e && krsPlotPatchValue(e.content, '阶段目标')) || '这条线已收束，无新目标。',
      hook: (e && krsPlotPatchValue(e.content, '背景描述')) || '这条主线已走完；可转后日谈。',
      content: (e && krsPlotPatchValue(e.content, '内容')) || '主线完结。'
    };
  }

  function openPlotPanel() {
    let modal = document.getElementById('krs-plot-modal-root');
    if (modal) modal.remove();
    modal = document.createElement('div');
    modal.id = 'krs-plot-modal-root';
    modal.className = 'krs-cg-modal-backdrop';
    try {
      if (document.querySelector('.krs-status-root.krs-dark')) modal.classList.add('krs-plot-dark');
    } catch (_) {}
    modal.innerHTML = '<div class="krs-cg-window krs-plot-window">'
      + '<div class="krs-cg-topbar"><div class="krs-cg-top-title"><span>📖 剧情总览</span></div>'
      + '<button type="button" class="krs-cg-close-btn" id="krs-plot-close">×</button></div>'
      + '<div class="krs-plot-tabs">'
      + '<button type="button" class="krs-plot-tab active" data-plot-tab="story">剧情</button>'
      + '<button type="button" class="krs-plot-tab" data-plot-tab="ext">扩展</button>'
      + '</div>'
      + '<div class="krs-plot-searchbar">'
      + '<input type="search" class="krs-plot-search-input" id="krs-plot-search" placeholder="🔍 搜索作品或主线名称...">'
      + '</div>'
      + '<div class="krs-plot-body is-stack" id="krs-plot-body"></div>'
      + '<div class="krs-plot-hint" id="krs-plot-hint">正在读取世界书…</div></div>';
    document.body.appendChild(modal);

    const hintEl = modal.querySelector('#krs-plot-hint');
    const searchEl = modal.querySelector('#krs-plot-search');
    let entries = null;
    let tab = 'story';
    let searchQuery = '';
    let storyDrawerOpen = false;
    let storyDrawerFilter = 'all'; // 'all' | 'off' | 'done'
    let extOnDrawerOpen = false;
    let extOffDrawerOpen = false;
    let justOpenedKey = '';

    const STORIES = KRS_PLOT_LINES.filter(function (l) { return l.story === '事件'; });
    const EXT_STORIES = STORIES.filter(function (l) { return !l.hideExt; });
    const EXPANSIONS = KRS_PLOT_LINES.filter(function (l) { return l.story === 'none' && !l.hideExt; });
    const EXT_ALL = EXT_STORIES.concat(EXPANSIONS);

    function extHasActiveStory(sd, extLine) {
      return STORIES.some(function (s) {
        return s.prefixes.some(function (p) { return extLine.prefixes.indexOf(p) >= 0; })
          && krsPlotStatusOf(sd, s).on;
      });
    }

    function paintTile(line) {
      const unknown = line._itemsOn === null;
      const on = line._itemsOn === true;
      const count = typeof line._count === 'number' ? line._count : -1;
      return '<button type="button" class="krs-plot-tile ' + (unknown ? 'unknown' : (on ? 'on' : 'off')) + '" data-ext-key="' + line.key + '"'
        + ' style="background-image:url(\'' + escHtml(line.cover || '') + '\')">'
        + '<span class="krs-plot-tile-state">' + (unknown ? '状态未知' : (on ? '已启用' : '未启用')) + '</span>'
        + '<span class="krs-plot-tile-name">' + escHtml(line.extLabel || line.label) + '</span>'
        + '<span class="krs-plot-tile-desc">' + escHtml(line.extDesc || line.desc || '') + '</span>'
        + '<span class="krs-plot-tile-count">' + (unknown ? '条目未知' : (count >= 0 ? count + ' 条世界书' : '条目未知')) + '</span>'
        + '</button>';
    }

    function paintStoryCard(line, sd, inDrawer) {
      const st = krsPlotStatusOf(sd, line);
      const open = !!line._open;
      const total = line.chapters.length;
      const idx = krsPlotChapterIndex(line, st.chapter);
      const order = st.chapter === '完结' ? (total + '/' + total) : (idx >= 0 ? ((idx + 1) + '/' + total) : ('—/' + total));
      const progressIdx = (st.done || st.chapter === '完结') ? total : (idx >= 0 ? idx : 0);
      const warn = (line._itemsOn === false && !st.on)
        ? '<div class="krs-plot-warn">扩展未启用，请先到「扩展」页开启。</div>' : '';
      const stateText = st.done ? '已完结' : (st.on ? '进行中' : (st.broken ? '已破弃' : '未开启'));
      const stateCls = st.done ? 'done' : (st.on ? 'on' : 'off');
      const btnText = st.on ? '关闭剧情' : ((st.done || st.broken) ? '重新开启' : '开启剧情');
      const popCls = (!inDrawer && justOpenedKey && justOpenedKey === line.key) ? ' is-pop-in' : '';

      const quickBtnHtml = (inDrawer && !st.on)
        ? (line._itemsOn === false
          ? '<span class="krs-plot-quick-btn disabled" data-plot-quick-open="' + line.key + '">需启扩展</span>'
          : '<span class="krs-plot-quick-btn" data-plot-quick-open="' + line.key + '">' + ((st.done || st.broken) ? '↻ 重开' : '▶ 开启') + '</span>')
        : '';

      const storyHtml = open
        ? '<div class="krs-plot-progress">' + line.chapters.map(function (c, i) {
            return '<span class="' + (i < progressIdx ? 'on' : '') + '"></span>';
          }).join('') + '</div>'
          + '<div class="krs-plot-story-top">'
          + '<span class="krs-plot-chapter-name" title="' + escHtml(krsPlotChapterTitle(line, st.chapter)) + '">' + escHtml(krsPlotChapterTitle(line, st.chapter)) + '</span>'
          + '<span class="krs-plot-chapter-order"><button type="button" data-plot-prev="' + line.key + '" title="上一章">‹</button>'
          + '<em>' + order + '</em>'
          + '<button type="button" data-plot-next="' + line.key + '" title="下一章">›</button></span>'
          + '</div>'
          + '<div class="krs-plot-stage"><b>阶段目标</b><span>' + escHtml(st.stage || '—') + '</span></div>'
          + '<div class="krs-plot-next"><b>下一步</b><span>' + escHtml(st.next || '—') + '</span></div>'
        : '';

      return '<div class="krs-plot-card ' + (open ? 'open ' : '') + stateCls + popCls + '" data-plot-card="' + line.key + '">'
        + '<button type="button" class="krs-plot-card-head" data-plot-head="' + line.key + '"'
        + ' style="background-image:url(\'' + escHtml(line.cover || '') + '\')">'
        + '<span class="krs-plot-card-name">' + escHtml(line.label) + '</span>'
        + '<span class="krs-plot-card-state">' + stateText + '</span>'
        + quickBtnHtml
        + '<span class="krs-plot-card-arrow">' + (open ? '▾' : '▸') + '</span>'
        + '</button>'
        + '<div class="krs-plot-card-body">'
        + '<div class="krs-plot-enabled' + (st.on ? '' : ' off') + '"><span>'
        + (st.done ? '✓ 剧情已完结' : (st.on ? '✓ 剧情进行中' : (st.broken ? '✗ 剧情已破弃' : '✗ 剧情未开启')))
        + '</span><button type="button" class="krs-plot-close-story" data-plot-close-story="' + line.key + '">' + btnText + '</button></div>'
        + warn + storyHtml
        + '</div></div>';
    }

    function paintExt() {
      const q = searchQuery.trim().toLowerCase();
      if (q) {
        const hits = EXT_ALL.filter(function (l) {
          return (l.extLabel || l.label || '').toLowerCase().indexOf(q) >= 0
            || (l.extDesc || l.desc || '').toLowerCase().indexOf(q) >= 0;
        });
        if (!hits.length) {
          return '<div class="krs-plot-empty-box" style="grid-column:1/-1;"><b>未找到匹配的扩展</b><span>换个关键词试试</span></div>';
        }
        return '<div class="krs-plot-ext-sec">◆ 搜索结果 (' + hits.length + ' 部)</div>' + hits.map(paintTile).join('');
      }
      let html = '';
      if (EXT_STORIES.length) {
        html += '<div class="krs-plot-ext-sec">◆ 可开启主线 · 角色 / 世界观 / 剧情细纲</div>';
        html += EXT_STORIES.map(paintTile).join('');
      }
      if (EXPANSIONS.length) {
        html += '<div class="krs-plot-ext-sec">◆ 联动扩展 · 仅有角色与世界观</div>';
        html += EXPANSIONS.map(paintTile).join('');
      }
      return html;
    }

    function paintStory() {
      const sd = rs() || {};
      const q = searchQuery.trim().toLowerCase();
      if (q) {
        const hits = STORIES.filter(function (l) {
          return (l.label || '').toLowerCase().indexOf(q) >= 0
            || (l.desc || '').toLowerCase().indexOf(q) >= 0
            || (l.event || '').toLowerCase().indexOf(q) >= 0;
        });
        if (!hits.length) {
          return '<div class="krs-plot-empty-box"><b>未找到匹配的主线</b><span>换个关键词试试</span></div>';
        }
        return '<div class="krs-plot-ext-sec">◆ 搜索结果 (' + hits.length + ' 条)</div>'
          + '<div class="krs-plot-active-wrap' + (hits.length === 1 ? ' is-single' : '') + '">'
          + hits.map(function (l) { return paintStoryCard(l, sd, !krsPlotStatusOf(sd, l).on); }).join('')
          + '</div>';
      }

      const activeList = [];
      const boxList = [];
      let offCnt = 0;
      let doneCnt = 0;
      let brokenCnt = 0;

      STORIES.forEach(function (line) {
        const st = krsPlotStatusOf(sd, line);
        if (st.on) {
          activeList.push(line);
        } else {
          boxList.push(line);
          if (st.done) doneCnt++;
          else if (st.broken) brokenCnt++;
          else offCnt++;
        }
      });

      let html = '';
      if (activeList.length) {
        html += '<div class="krs-plot-ext-sec">🔥 进行中的主线 (' + activeList.length + ' 条)</div>'
          + '<div class="krs-plot-active-wrap' + (activeList.length === 1 ? ' is-single' : '') + '">'
          + activeList.map(function (l) { return paintStoryCard(l, sd, false); }).join('')
          + '</div>';
      } else {
        html += '<div class="krs-plot-empty-box">'
          + '<b>✨ 当前暂无进行中的主线剧情</b>'
          + '<span>全部未开启主线已自动收入下方收纳盒，点开挑选开启后会直接跳出到此处。</span>'
          + '</div>';
      }

      if (boxList.length) {
        const subParts = [];
        if (offCnt) subParts.push('未开启 ' + offCnt);
        if (doneCnt) subParts.push('已完结 ' + doneCnt);
        if (brokenCnt) subParts.push('已破弃 ' + brokenCnt);

        const filteredBox = boxList.filter(function (line) {
          if (storyDrawerFilter === 'all') return true;
          const st = krsPlotStatusOf(sd, line);
          if (storyDrawerFilter === 'off') return !st.done && !st.broken;
          return st.done || st.broken;
        });

        let drawerInner = '';
        if (storyDrawerOpen) {
          const filterBar = (doneCnt + brokenCnt > 0)
            ? '<div class="krs-plot-drawer-filters">'
              + '<button type="button" class="krs-plot-df-pill' + (storyDrawerFilter === 'all' ? ' active' : '') + '" data-plot-sfilter="all">全部 (' + boxList.length + ')</button>'
              + '<button type="button" class="krs-plot-df-pill' + (storyDrawerFilter === 'off' ? ' active' : '') + '" data-plot-sfilter="off">未开启 (' + offCnt + ')</button>'
              + '<button type="button" class="krs-plot-df-pill' + (storyDrawerFilter === 'done' ? ' active' : '') + '" data-plot-sfilter="done">已完结 / 破弃 (' + (doneCnt + brokenCnt) + ')</button>'
              + '</div>'
            : '';
          drawerInner = '<div class="krs-plot-drawer-body">'
            + filterBar
            + '<div class="krs-plot-active-wrap">'
            + filteredBox.map(function (l) { return paintStoryCard(l, sd, true); }).join('')
            + '</div></div>';
        }

        html += '<div class="krs-plot-drawer">'
          + '<button type="button" class="krs-plot-drawer-head" data-plot-drawer="story">'
          + '<div class="krs-plot-dh-left">'
          + '<span class="krs-plot-dh-title">📦 ' + (activeList.length ? '其他主线收纳盒' : '全部主线收纳盒') + '</span>'
          + '<span class="krs-plot-dh-badge">' + boxList.length + ' 条</span>'
          + (subParts.length ? ('<span class="krs-plot-dh-sub">' + subParts.join(' · ') + '</span>') : '')
          + '</div>'
          + '<span class="krs-plot-dh-arrow">' + (storyDrawerOpen ? '收起 ▴' : '展开挑选 ▾') + '</span>'
          + '</button>'
          + drawerInner
          + '</div>';
      }

      return html;
    }

    function render() {
      const body = modal.querySelector('#krs-plot-body');
      if (!body) return;
      modal.querySelectorAll('[data-plot-tab]').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-plot-tab') === tab);
      });
      if (searchEl) {
        searchEl.placeholder = tab === 'story' ? '🔍 搜索想开启的主线剧情...' : '🔍 搜索作品世界书扩展...';
      }
      body.className = 'krs-plot-body ' + (tab === 'ext' ? 'grid-ext' : 'is-stack');
      try {
        body.innerHTML = tab === 'ext' ? paintExt() : paintStory();
      } catch (err) {
        console.warn('[剧情] 渲染失败', err);
        body.innerHTML = '<div class="krs-plot-hint">渲染失败：' + escHtml(String((err && err.message) || err)) + '</div>';
      }
    }

    function applyDefaultOpen() {
      const sd = rs() || {};
      STORIES.forEach(function (line) {
        const st = krsPlotStatusOf(sd, line);
        /* 仅「进行中」主线默认展开在外部；收纳盒内的未开启主线保持折叠紧凑 */
        line._open = st.on;
      });
    }

    async function refreshEntryState() {
      const TH = krsPlotHelper();
      entries = await krsPlotGetEntries(TH);
      KRS_PLOT_LINES.forEach(function (line) {
        const list = (entries || []).filter(function (e) {
          const c = krsEntryLabel(e);
          return line.prefixes.some(function (p) { return c.indexOf(p) === 0; });
        });
        line._entries = list;
        line._count = entries ? list.length : -1;
        line._itemsOn = entries ? list.some(function (e) { return krsEntryOn(e); }) : null;
      });
      return entries;
    }

    async function clearStoryVars(line) {
      await mutateMvuStat(function (r) {
        const ev = safeGet(r, line.event, null);
        if (!ev || typeof ev !== 'object') return;
        safeSet(r, line.event + '.状态', '破弃');
        safeSet(r, line.event + '.阶段目标', '剧情控制器已关闭这条主线。');
        safeSet(r, line.event + '.背景描述', '');
        safeSet(r, line.event + '.内容', '等待重新开启。');
      });
    }

    async function applyStory(line, target) {
      const total = line.chapters.length;
      const isFinal = target === '完结' || target === total;
      let brief;
      let status;
      let stage;
      if (isFinal) {
        brief = krsPlotFinalBrief(line);
        status = '达成';
        stage = '完结';
      } else {
        const idx = typeof target === 'number' ? target : krsPlotChapterIndex(line, target);
        const safeIdx = Math.max(0, Math.min(total - 1, idx));
        brief = krsPlotBrief(line, safeIdx);
        status = '进行中';
        stage = line.chapters[safeIdx].stage;
      }
      await mutateMvuStat(function (r) {
        const ev = safeGet(r, line.event, null);
        if (!ev) {
          safeSet(r, line.event, {
            类型: '命运',
            角色与任务: line.role,
            状态: status,
            阶段: stage,
            阶段目标: brief.goal,
            背景描述: brief.hook,
            内容: brief.content
          });
          return;
        }
        safeSet(r, line.event + '.类型', '命运');
        safeSet(r, line.event + '.角色与任务', line.role);
        safeSet(r, line.event + '.状态', status);
        safeSet(r, line.event + '.阶段', stage);
        safeSet(r, line.event + '.阶段目标', brief.goal);
        safeSet(r, line.event + '.背景描述', brief.hook);
        safeSet(r, line.event + '.内容', brief.content);
      });
    }

    async function toggleExt(line) {
      const next = line._itemsOn !== true;
      const res = await krsPlotToggleEntries(line.prefixes, next);
      const siblings = KRS_PLOT_LINES.filter(function (l) {
        return l.prefixes.some(function (p) { return line.prefixes.indexOf(p) >= 0; });
      });
      if (res.ok) siblings.forEach(function (s) { s._itemsOn = next; });
      if (!next && res.ok) {
        for (let i = 0; i < siblings.length; i++) {
          if (siblings[i].story === '事件') await clearStoryVars(siblings[i]);
        }
      }
      if (hintEl) {
        const title = line.extLabel || line.label;
        const hasStory = siblings.some(function (s) { return s.story === '事件'; });
        hintEl.textContent = !res.ok
          ? '世界书接口不可用：条目未能同步开关。'
          : (!res.changed
            ? ('「' + title + '」没有匹配到条目，世界书没有改动。')
            : (next
              ? ('已启用「' + title + '」：' + res.changed + ' 条世界书条目已打开。')
              : ('已关闭「' + title + '」：' + res.changed + ' 条条目已关闭' + (hasStory ? '，相关主线已标记为「破弃」。' : '。'))));
      }
      try { renderAll(); } catch (_) {}
      render();
    }

    async function openStory(line) {
      if (line._itemsOn === false) {
        if (hintEl) hintEl.textContent = '「' + line.label + '」扩展未启用，请先切到「扩展」页开启。';
        return;
      }
      line._open = true;
      const st = krsPlotStatusOf(rs() || {}, line);
      let stage = line.chapters[0].stage;
      if (st.exists && st.broken && st.chapter && krsPlotChapterIndex(line, st.chapter) >= 0) {
        stage = st.chapter;
      }
      await applyStory(line, stage);
      /* 开启后自动收起收纳盒、移出至外部活跃区并滚回顶部 */
      justOpenedKey = line.key;
      storyDrawerOpen = false;
      searchQuery = '';
      if (searchEl) searchEl.value = '';
      if (hintEl) hintEl.textContent = '「' + line.label + '」已开启（' + krsPlotChapterTitle(line, stage) + '），已移出至上方进行中列表。';
      try { renderAll(); } catch (_) {}
      render();
      const body = modal.querySelector('#krs-plot-body');
      if (body) body.scrollTop = 0;
      setTimeout(function () { if (justOpenedKey === line.key) justOpenedKey = ''; }, 900);
    }

    async function closeStory(line) {
      line._open = false;
      await clearStoryVars(line);
      if (hintEl) hintEl.textContent = '「' + line.label + '」已关闭并收回收纳盒；作品扩展条目保持启用。';
      try { renderAll(); } catch (_) {}
      render();
    }

    async function stepChapter(line, dir) {
      const total = line.chapters.length;
      if (!line._itemsOn) {
        if (hintEl) hintEl.textContent = '「' + line.label + '」扩展未启用，请先切到「扩展」页开启。';
        return;
      }
      const st = krsPlotStatusOf(rs() || {}, line);
      let idx = st.chapter === '完结' ? total : krsPlotChapterIndex(line, st.chapter);
      if (idx < 0) idx = 0;
      const target = Math.max(0, Math.min(total, idx + dir));
      const isDone = target === total;
      line._open = !isDone;
      await applyStory(line, isDone ? '完结' : line.chapters[target].stage);
      if (hintEl) {
        hintEl.textContent = isDone
          ? ('「' + line.label + '」已完结，已自动收入收纳盒。')
          : ('「' + line.label + '」已推进到：' + line.chapters[target].title + '。');
      }
      try { renderAll(); } catch (_) {}
      render();
    }

    function extSummary() {
      const on = EXT_ALL.filter(function (l) { return l._itemsOn === true; }).length;
      const active = STORIES.filter(function (l) { return krsPlotStatusOf(rs() || {}, l).on; }).length;
      return '世界书 ' + krsPlotRead.books + ' 本 · ' + krsPlotRead.entries + ' 条　｜　扩展已启用 '
        + on + ' / ' + EXT_ALL.length + '　｜　主线进行中 ' + active + ' / ' + STORIES.length;
    }

    if (searchEl) {
      searchEl.addEventListener('input', function () {
        searchQuery = searchEl.value || '';
        render();
      });
    }

    modal.addEventListener('click', async function (ev) {
      if (ev.target === modal || ev.target.closest('#krs-plot-close')) { modal.remove(); return; }

      const quickOpen = ev.target.closest('[data-plot-quick-open]');
      if (quickOpen) {
        ev.stopPropagation();
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === quickOpen.getAttribute('data-plot-quick-open'); });
        if (line) await openStory(line);
        return;
      }

      const drawerBtn = ev.target.closest('[data-plot-drawer]');
      if (drawerBtn) {
        const which = drawerBtn.getAttribute('data-plot-drawer');
        if (which === 'story') storyDrawerOpen = !storyDrawerOpen;
        else if (which === 'ext-on') extOnDrawerOpen = !extOnDrawerOpen;
        else if (which === 'ext-off') extOffDrawerOpen = !extOffDrawerOpen;
        render();
        return;
      }

      const sFilter = ev.target.closest('[data-plot-sfilter]');
      if (sFilter) {
        storyDrawerFilter = sFilter.getAttribute('data-plot-sfilter') || 'all';
        render();
        return;
      }

      const tabBtn = ev.target.closest('[data-plot-tab]');
      if (tabBtn) {
        const next = tabBtn.getAttribute('data-plot-tab');
        if (next === tab) return;
        tab = next;
        searchQuery = '';
        if (searchEl) searchEl.value = '';
        await refreshEntryState();
        if (tab === 'story') applyDefaultOpen();
        render();
        return;
      }

      const ext = ev.target.closest('[data-ext-key]');
      if (ext) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === ext.getAttribute('data-ext-key'); });
        if (line) await toggleExt(line);
        return;
      }

      const closeBtn = ev.target.closest('[data-plot-close-story]');
      if (closeBtn) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === closeBtn.getAttribute('data-plot-close-story'); });
        if (line) {
          const st = krsPlotStatusOf(rs() || {}, line);
          if (st.on) await closeStory(line); else await openStory(line);
        }
        return;
      }

      const head = ev.target.closest('[data-plot-head]');
      if (head) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === head.getAttribute('data-plot-head'); });
        if (line) { line._open = !line._open; render(); }
        return;
      }

      const p = ev.target.closest('[data-plot-prev]');
      const n = ev.target.closest('[data-plot-next]');
      if (p || n) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === (p || n).getAttribute(p ? 'data-plot-prev' : 'data-plot-next'); });
        if (line) await stepChapter(line, p ? -1 : 1);
      }
    });

    (async function () {
      await refreshEntryState();
      applyDefaultOpen();
      if (hintEl) hintEl.textContent = entries ? extSummary() : '未找到世界书接口：剧情变量仍可推进，但扩展条目无法同步开关。';
      render();
    })();
  }


  /* ═══ 对白双语切换（世界书蓝灯 / 绿灯 + 正则联动） ═══ */
  const KRS_LANG_PREFIX = {
    zh: ['[中文-对白美化]', '[RULE]中文- 角色对话格式', '[RULE]中文-角色对话格式'],
    ja: ['[日文-对白美化]', '[RULE]日文- 角色对话格式', '[RULE]日文-角色对话格式']
  };
  const KRS_LANG_LABEL = { zh: '纯中文', ja: '中日双语' };
  const KRS_LANG_REGEX = {
    zh: '【中文 - 对白美化v2.6】',
    ja: '【中日双语·ruby版 - 对白美化v2.6】',
    off: ['【中日双语·纯中文·去除日语v2.6】', '【中日双语·ruby版 - 中文在下v2.6】']
  };
  let krsLangBusy = false;

  function krsLangMatch(name, key) {
    const text = String(name || '');
    return KRS_LANG_PREFIX[key].some(function (p) { return text.indexOf(p) >= 0; });
  }

  function krsEntryIsConstant(e) {
    if (!e || typeof e !== 'object') return false;
    if (e.strategy && typeof e.strategy.type === 'string') return e.strategy.type === 'constant';
    return e.constant === true;
  }

  function krsEntryWithConstant(e, on) {
    const out = Object.assign({}, e);
    const st = (e && e.strategy && typeof e.strategy === 'object') ? Object.assign({}, e.strategy) : {};
    const wasVectorized = st.type === 'vectorized';
    st.type = on ? 'constant' : (wasVectorized ? 'vectorized' : 'selective');
    out.strategy = st;
    out.constant = on;
    out.enabled = true;
    return out;
  }

  function krsGlobalFn(name) {
    const scopes = [window, window.parent, window.top];
    for (let i = 0; i < scopes.length; i++) {
      const sc = scopes[i];
      try { if (sc && typeof sc[name] === 'function') return sc[name].bind(sc); } catch (_) {}
      try { if (sc && sc.TavernHelper && typeof sc.TavernHelper[name] === 'function') return sc.TavernHelper[name].bind(sc.TavernHelper); } catch (_) {}
    }
    return null;
  }

  function krsRegexListOf(raw) {
    if (Array.isArray(raw)) return raw;
    if (raw && Array.isArray(raw.regexes)) return raw.regexes;
    return null;
  }

  async function krsRegexState() {
    const get = krsGlobalFn('getTavernRegexes');
    if (typeof get !== 'function') return { available: false, zh: false, ja: false };
    try {
      const raw = await Promise.resolve(get({ type: 'character' }));
      const list = krsRegexListOf(raw);
      if (!list) return { available: false, zh: false, ja: false };
      const state = { available: true, zh: false, ja: false };
      list.forEach(function (r) {
        const name = String(r.script_name || r.scriptName || r.name || '');
        if (name.indexOf(KRS_LANG_REGEX.zh) >= 0) state.zh = !!r.enabled;
        if (name.indexOf(KRS_LANG_REGEX.ja) >= 0) state.ja = !!r.enabled;
      });
      return state;
    } catch (_) { return { available: false, zh: false, ja: false }; }
  }

  async function krsRegexSet(target) {
    const update = krsGlobalFn('updateTavernRegexesWith');
    if (typeof update !== 'function') return { ok: false, available: false, err: '没有正则写入接口' };
    try {
      await Promise.resolve(update(function (regexes) {
        const list = krsRegexListOf(regexes);
        if (!list) return regexes;
        return list.map(function (r) {
          const name = String(r.script_name || r.scriptName || r.name || '');
          if (name.indexOf(KRS_LANG_REGEX.zh) >= 0) return Object.assign({}, r, { enabled: target === 'zh' });
          if (name.indexOf(KRS_LANG_REGEX.ja) >= 0) return Object.assign({}, r, { enabled: target === 'ja' });
          if (KRS_LANG_REGEX.off.some(function (p) { return name.indexOf(p) >= 0; })) return Object.assign({}, r, { enabled: false });
          return r;
        });
      }, { type: 'character' }));
      return { ok: true, available: true, err: '' };
    } catch (e) { return { ok: false, available: true, err: String((e && e.message) || e) }; }
  }

  async function krsLangScan() {
    const res = { found: false, zhGreen: false, jaGreen: false, regexAvailable: false, zhRegex: false, jaRegex: false, matchedBooks: [] };
    const TH = krsPlotHelper();
    if (TH && typeof TH.getWorldbook === 'function') {
      const names = await krsPlotBookNames(TH);
      for (let i = 0; i < names.length; i++) {
        let raw = null;
        try { raw = await Promise.resolve(TH.getWorldbook(names[i])); } catch (_) { continue; }
        let hit = false;
        krsFlattenEntries(raw).forEach(function (e) {
          const c = String(e.comment || e.name || '');
          const on = e.enabled !== false;
          if (krsLangMatch(c, 'zh')) { res.found = true; hit = true; if (on && krsEntryIsConstant(e)) res.zhGreen = true; }
          if (krsLangMatch(c, 'ja')) { res.found = true; hit = true; if (on && krsEntryIsConstant(e)) res.jaGreen = true; }
        });
        if (hit && res.matchedBooks.indexOf(names[i]) < 0) res.matchedBooks.push(names[i]);
      }
    }
    const rx = await krsRegexState();
    res.regexAvailable = rx.available;
    res.zhRegex = rx.zh;
    res.jaRegex = rx.ja;
    return res;
  }

  function krsLangModeOf(r) {
    if (!r || !r.found) return '';
    if (r.jaGreen && !r.zhGreen) return 'ja';
    return 'zh';
  }

  async function krsLangApply(target, preScan) {
    const TH = krsPlotHelper();
    if (!TH) return { ok: false, err: 'TavernHelper 不可用' };
    const names = (preScan && preScan.matchedBooks && preScan.matchedBooks.length)
      ? preScan.matchedBooks
      : await krsPlotBookNames(TH);
    if (!names.length) return { ok: false, err: '没有找到世界书' };
    const errs = [];
    let wrote = false;
    for (let i = 0; i < names.length; i++) {
      if (typeof TH.updateWorldbookWith !== 'function') continue;
      try {
        await Promise.resolve(TH.updateWorldbookWith(names[i], function (entries) {
          return krsFlattenEntries(entries).map(function (e) {
            const c = String(e.comment || e.name || '');
            const isZh = krsLangMatch(c, 'zh');
            const isJa = krsLangMatch(c, 'ja');
            if (!isZh && !isJa) return e;
            return krsEntryWithConstant(e, isZh ? target === 'zh' : target === 'ja');
          });
        }));
        wrote = true;
      } catch (e) { errs.push(String((e && e.message) || e)); }
    }
    if (!wrote) errs.push('世界书写入失败');

    /* ▼ 方案 A（不重载面板）：保持下面这 4 行注释；若选方案 B（自动切正则但会重载面板），请取消这 4 行注释 ▼ */
    // const rr = await krsRegexSet(target);
    // if (!rr.ok && rr.available) errs.push(rr.err);

    let scan = null;
    try { scan = await krsLangScan(); } catch (_) {}
    const mode = krsLangModeOf(scan || {});
    // 方案 B 时把下一行改成：const regexOK = !scan || !scan.regexAvailable || (target === 'zh' ? (scan.zhRegex && !scan.jaRegex) : (scan.jaRegex && !scan.zhRegex));
    const regexOK = true;
    if (mode === target && regexOK) return { ok: true, err: '' };
    return { ok: false, err: errs.join(' | ') || ('写入后状态仍是 ' + (mode || '未知')) };
  }

  async function krsLangRefresh() {
    const buttons = Array.from(document.querySelectorAll('.krs-lang-switch'));
    if (!buttons.length) return;
    let scan = null;
    try { scan = await krsLangScan(); } catch (_) {}
    const mode = krsLangModeOf(scan || {});
    buttons.forEach(function (btn) {
      btn.setAttribute('data-mode', mode || 'err');
      const txt = btn.querySelector('.krs-lang-text');
      if (txt) txt.textContent = (scan && scan.found) ? (KRS_LANG_LABEL[mode] || '纯中文') : '未找到';
      btn.title = (scan && scan.found)
        ? (mode === 'ja' ? '当前：中日双语（日文条目常驻）→ 点击切回纯中文' : '当前：纯中文（中文条目常驻）→ 点击切到中日双语')
        : '没找到 [RULE]中文/日文- 角色对话格式 条目';
    });
  }

  async function krsLangToggle() {
    if (krsLangBusy) return;
    krsLangBusy = true;
    const buttons = Array.from(document.querySelectorAll('.krs-lang-switch'));
    buttons.forEach(function (b) { b.classList.add('busy'); });
    try {
      const scan = await krsLangScan();
      if (!scan.found) {
        buttons.forEach(function (b) {
          b.setAttribute('data-mode', 'err');
          const t = b.querySelector('.krs-lang-text');
          if (t) t.textContent = '未找到';
        });
        console.warn('[对白语言] 世界书里没有 [RULE]中文/日文- 角色对话格式 条目');
        return;
      }
      const cur = krsLangModeOf(scan);
      const target = cur === 'zh' ? 'ja' : 'zh';
      const res = await krsLangApply(target, scan);
      if (!res.ok) {
        buttons.forEach(function (b) {
          b.setAttribute('data-mode', 'err');
          const t = b.querySelector('.krs-lang-text');
          if (t) t.textContent = '切换失败';
          b.title = '切换失败：' + res.err;
        });
        console.warn('[对白语言] 切换失败：', res.err);
      }
    } catch (e) {
      console.warn('[对白语言] 异常：', e);
    } finally {
      krsLangBusy = false;
      buttons.forEach(function (b) { b.classList.remove('busy'); });
      try { await krsLangRefresh(); } catch (_) {}
    }
  }
