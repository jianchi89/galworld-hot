<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<div class="krs-status-root" data-krs-panel="true">
  <div class="krs-board">

    <!-- 🌟 单行紧凑顶栏（时间框仅展示时间+日期+天气，绝不挤压） -->
    <div class="krs-top-nav-bar">
      <div class="krs-nav-tabs">
        <button type="button" class="krs-nav-tab active" data-tab="relations">
          <span class="tab-num">01</span><span class="tab-text">关系</span>
          <span class="krs-nav-badge char-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="hero">
          <span class="tab-num">02</span><span class="tab-text">主角</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="assets">
          <span class="tab-num">03</span><span class="tab-text">生涯</span>
          <span class="krs-nav-badge asset-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="destiny">
          <span class="tab-num">04</span><span class="tab-text">日程</span>
          <span class="krs-nav-badge event-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="map">
          <span class="tab-num">05</span><span class="tab-text">都市</span>
        </button>
      </div>

      <!-- ⭐ 纯净时间+日期+天气胶囊（不放地点，天气完整显示） -->
      <div class="krs-datetime" id="krs-datetime" title="">
        <span class="krs-dt-time" id="krs-dt-time">--:--</span>
        <i class="krs-dt-dot"></i>
        <span class="krs-dt-date" id="krs-dt-date">—</span>
        <i class="krs-dt-dot"></i>
        <span class="krs-dt-weather-icon" id="krs-dt-wicon"></span>
        <span class="krs-dt-weather" id="krs-dt-weather"></span>
      </div>

      <div class="krs-nav-actions">
        <button type="button" class="krs-pill theme-toggle-btn" id="krs-btn-theme" title="切换晨纸亮色 / 星夜暗色">
          <span class="theme-icon">🌙</span><span class="theme-text">暗色</span>
        </button>
        <button type="button" class="krs-pill edit-toggle-btn" title="开关变量编辑模式">
          <span>✏️</span><span class="act-txt">编辑</span>
        </button>
        <button type="button" class="krs-pill krs-plot-hub-btn" title="打开剧情总览：作品世界书开关与主线章节推进">
          <span>📖</span><span class="act-txt">剧情</span>
        </button>
        <button type="button" class="krs-pill cg-hub-btn" title="查看角色与作品图鉴">
          <span>🖼️</span><span class="act-txt">图鉴</span>
        </button>
        <button type="button" class="krs-collapse-btn" id="krs-btn-collapse" title="折叠/展开状态栏">
          <span class="krs-collapse-text">收起</span>
          <span class="krs-collapse-icon">▲</span>
        </button>
      </div>
    </div>

    <!-- 🌟 折叠态微缩视觉 HUD（地点紧跟在生涯后面） -->
    <div class="krs-mini-hud" id="krs-mini-hud"></div>

    <!-- 🌟 内容视口舞台 -->
    <div class="krs-stage-container">

      <!-- ================= 01 · 角色关系 (左窄竖栏默认收起 + 中全高立绘框 + 右全部文字) ================= -->
      <div class="krs-tab-pane active" id="pane-relations">
        <div class="krs-pane-scroll-inner gw-master-detail is-slim" id="rel-master-detail">
          <aside class="gw-side-list">
            <button type="button" class="gw-slim-toggle" data-toggle-slim="1" title="展开/收起侧边栏">
              <span class="gw-st-full"><b>人物名册</b><i>« 收起</i></span>
              <span class="gw-st-mini">展开 »</span>
            </button>
            <div class="gw-vertical-track" id="relations-char-slider"></div>
            <button type="button" class="gw-sort-btn" data-toggle-sort="1">⇅ 拖动排序</button>
          </aside>
          <main class="gw-main-stage" id="relations-char-stage"></main>
        </div>
      </div>

      <!-- ================= 02 · 主角档案 ================= -->
      <div class="krs-tab-pane" id="pane-hero">
        <div class="krs-pane-scroll-inner gw-hero-bento">
          <aside class="gw-id-card">
            <div class="gw-id-head">
              <span class="krs-micro-label">KUMOMI REGISTRY</span>
              <span class="gw-id-stamp">2018</span>
            </div>
            <img class="hero-avatar-img" src="" alt="" style="display:none !important;">
            <div class="gw-id-name-block" style="padding-top:4px;">
              <div class="gw-id-name-row" style="flex-wrap:wrap;justify-content:center;">
                <span class="krs-u-name hero-name-text" data-krs-edit="user.称呼" data-krs-label="主角称呼">--</span>
                <span class="krs-u-age-pill hero-age-text" data-krs-edit="user.年龄" data-krs-label="主角年龄">--</span>
                <span class="krs-u-bool-pill cross hero-cross-badge" data-krs-edit="user.女装" data-krs-label="女装状态" data-krs-type="boolean">👗 女装</span>
                <span class="krs-u-bool-pill futa hero-futa-badge" data-krs-edit="user.futa模式" data-krs-label="Futa模式" data-krs-type="boolean">⚧ Futa</span>
              </div>
              <div class="krs-u-badges hero-id-pills" data-krs-edit="user.身份" data-krs-label="主角身份（顿号分隔）"></div>
            </div>
            <div class="gw-id-kpis">
              <div class="gw-id-kpi" data-krs-edit="user.钱包" data-krs-label="持有日元 (円)" data-krs-type="number">
                <span class="krs-dash-title">💴 个人钱包</span>
                <span class="krs-dash-val gold hero-gold-text">¥0</span>
              </div>
              <button type="button" class="gw-id-kpi krs-lang-switch" id="krs-lang-switch" data-mode="" title="点击切换纯中文 / 中日双语">
                <span class="krs-dash-title">🌐 对白语言</span>
                <span class="krs-lang-text">默认</span>
              </button>
            </div>
            <div class="gw-lust-widget" data-krs-edit="user.淫乱度" data-krs-label="身心接受度 / 淫乱度 (0-200)" data-krs-type="number">
              <div class="krs-gauge-top">
                <span>身心接受度</span>
                <span class="krs-gauge-stage hero-lust-stage">0 / 200 · 抵抗</span>
              </div>
              <div class="krs-gauge-track">
                <div class="krs-gauge-fill hero-lust-bar" style="width: 0%;"></div>
              </div>
              <div class="gw-lust-nodes" id="hero-lust-nodes">
                <span>抵抗</span><span>妥协</span><span>适应</span><span>沉溺</span>
              </div>
            </div>
          </aside>

          <div class="gw-hero-right">
            <div class="gw-bento-loc-bar" data-krs-edit="世界.地点" data-krs-label="当前所在地点">
              <span class="gw-loc-tag">📍 LOCATION</span>
              <strong class="hero-loc-text">--</strong>
              <span class="gw-loc-jump" data-Switch-tab="map">都市地图 ➔</span>
            </div>
            <div class="krs-u-meta-grid">
              <div class="krs-u-meta-card">
                <span class="krs-meta-lbl">👔 今日穿搭与制服</span>
                <div class="krs-meta-val hero-dress-text" data-krs-edit="user.服装" data-krs-label="主角服装" data-krs-type="textarea">--</div>
              </div>
              <div class="krs-u-meta-card">
                <span class="krs-meta-lbl">💭 当下身心状态</span>
                <div class="krs-meta-val hero-status-text" data-krs-edit="user.状态" data-krs-label="主角状态" data-krs-type="textarea">--</div>
              </div>
              <div class="krs-u-meta-card">
                <span class="krs-meta-lbl">💬 校内与街区风评</span>
                <div class="krs-meta-val hero-repute-text" data-krs-edit="user.风评" data-krs-label="外界风评" data-krs-type="textarea">--</div>
              </div>
              <div class="krs-u-meta-card rose-card">
                <span class="krs-meta-lbl">💮 身体特征与刻印</span>
                <div class="krs-meta-val rose hero-body-text" data-krs-edit="user.身体" data-krs-label="身体特征与刻印" data-krs-type="textarea">--</div>
              </div>
            </div>
            <div class="krs-ability-block">
              <div class="krs-sub-sec-head">
                <div>
                  <span class="krs-micro-label">ACTIVE CAREERS & PASSES</span>
                  <span class="sec-title">🗂️ 已开启的生涯与通行档案</span>
                </div>
                <span class="sec-sub">点击卡片直达【03 生涯】</span>
              </div>
              <div class="krs-hero-career-preview" id="hero-career-preview"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= 03 · 生涯与资产 ================= -->
      <div class="krs-tab-pane" id="pane-assets">
        <div class="krs-pane-scroll-inner gw-master-detail is-slim" id="asset-master-detail">
          <aside class="gw-side-list">
            <button type="button" class="gw-slim-toggle" data-toggle-slim="1" title="展开/收起侧边栏">
              <span class="gw-st-full"><b>生涯档案</b><i>« 收起</i></span>
              <span class="gw-st-mini">展开 »</span>
            </button>
            <div class="krs-asset-cat-nav" id="assets-category-bar"></div>
            <div class="gw-vertical-track" id="assets-slider"></div>
            <button type="button" class="gw-sort-btn" data-toggle-sort="1">⇅ 拖动排序</button>
          </aside>
          <main class="gw-main-stage" id="assets-stage"></main>
        </div>
      </div>

      <!-- ================= 04 · 命途与纪事 ================= -->
      <div class="krs-tab-pane" id="pane-destiny">
        <div class="krs-pane-scroll-inner krs-destiny-view" id="destiny-stage"></div>
      </div>

      <!-- ================= 05 · 联合都市地图 ================= -->
      <div class="krs-tab-pane" id="pane-map">
        <div class="pdr-embedded-map-container">
          <div class="pdr-map-viewport" id="pdr-viewport">
            <div class="pdr-map-canvas" id="pdr-canvas">
              <div class="pdr-factions-layer" id="pdr-factions-layer"></div>
              <svg class="pdr-map-svg" id="pdr-svg-lines"></svg>
              <div class="pdr-map-nodes" id="pdr-nodes-layer"></div>
            </div>
            <div class="pdr-map-controls">
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-in" title="放大视野">+</button>
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-out" title="缩小视野">−</button>
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-reset" title="复位至云下校园中枢">⟲</button>
            </div>
            <div class="pdr-location-drawer" id="pdr-drawer">
              <div class="pdr-drawer-left">
                <div class="pdr-dl-head">
                  <span class="pdr-dl-name" id="pdr-info-name">云下学园·中枢</span>
                  <span class="pdr-dl-nation" id="pdr-info-nation">云见联合都市</span>
                  <span class="pdr-dl-type" id="pdr-info-type">核心学区</span>
                </div>
                <div class="pdr-dl-desc" id="pdr-info-desc">坐落于云见海边的巨型联合学园中枢，西侧混校区与东侧女子校区以樱花主干道相隔。</div>
                <div class="pdr-dl-subplaces" id="pdr-info-subs"></div>
              </div>
              <div class="pdr-drawer-right">
                <div class="pdr-dr-stat">
                  <span>交通距离</span>
                  <strong id="pdr-info-cost">都市电车直达</strong>
                </div>
                <button type="button" class="pdr-btn-relocate" id="pdr-btn-set-loc">📍 移动至此</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
.mes:has(.krs-status-root), .mes_text:has(.krs-status-root), .mes_block:has(.krs-status-root) {
  background: transparent !important; border: 0 !important; box-shadow: none !important;
  padding: 2px !important; max-height: none !important; height: auto !important; overflow: visible !important;
}
.mes:has(.krs-status-root) > .avatar, .mes:has(.krs-status-root) .avatar, .mes:has(.krs-status-root) .ch_name { display: none !important; }

.krs-status-root {
  --bg-board: radial-gradient(ellipse 60% 50% at 8% 0%, rgba(194,132,148,.20), transparent 60%),
              radial-gradient(ellipse 50% 45% at 92% 10%, rgba(141,164,143,.15), transparent 60%),
              linear-gradient(145deg, #fbf5ec 0%, #f4ebdf 52%, #eee2d2 100%);
  --surface-1: rgba(255, 252, 247, .88);
  --surface-2: rgba(255, 253, 249, .72);
  --surface-3: rgba(244, 234, 220, .68);
  --paper: #2b211c;
  --paper-soft: #4a3a30;
  --muted: rgba(43, 33, 28, .70);
  --muted-2: rgba(43, 33, 28, .48);
  --line: rgba(91, 65, 49, .13);
  --line-strong: rgba(91, 65, 49, .25);
  --rose: #a64f68;
  --rose-deep: #8c3e55;
  --violet: #75619c;
  --cyan: #386f64;
  --gold: #8c6630;
  --blue: #4f6d9c;
  --danger: #b34545;
  --cal-rose: #c45670;
  --cal-rose-bg: rgba(196, 86, 112, .13);
  --cal-blue: #4778ab;
  --cal-blue-bg: rgba(71, 120, 171, .13);
  --cal-amber: #b37e32;
  --cal-amber-bg: rgba(179, 126, 50, .14);
  --cal-violet: #7c65b5;
  --cal-violet-bg: rgba(124, 101, 181, .14);
  --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --font-mono: "SFMono-Regular", "Consolas", monospace;

  width: 100%; max-width: 980px; margin: 8px auto;
  color: var(--paper); font-family: var(--font-sans);
  user-select: none; box-sizing: border-box; position: relative;
}
.krs-status-root.krs-dark {
  --bg-board: radial-gradient(ellipse 60% 50% at 10% 0%, rgba(110,85,165,.22), transparent 60%),
              radial-gradient(ellipse 50% 45% at 90% 12%, rgba(185,80,108,.16), transparent 60%),
              linear-gradient(145deg, #0b0f19 0%, #101624 52%, #090c14 100%);
  --surface-1: rgba(20, 25, 40, .86);
  --surface-2: rgba(15, 19, 32, .76);
  --surface-3: rgba(28, 35, 54, .70);
  --paper: #f4f0e7;
  --paper-soft: #dfd8cc;
  --muted: rgba(239, 234, 224, .68);
  --muted-2: rgba(239, 234, 224, .45);
  --line: rgba(241, 235, 223, .11);
  --line-strong: rgba(241, 235, 223, .22);
  --rose: #ff92a8;
  --rose-deep: #ffb4c4;
  --violet: #b3a7ff;
  --cyan: #7ce7da;
  --gold: #e7c48b;
  --blue: #87a8ff;
  --danger: #ff7f86;
  --cal-rose: #eb8ca2;
  --cal-rose-bg: rgba(201, 93, 118, .20);
  --cal-blue: #7eb2e8;
  --cal-blue-bg: rgba(79, 130, 181, .20);
  --cal-amber: #e2b566;
  --cal-amber-bg: rgba(184, 132, 53, .20);
  --cal-violet: #b6a3eb;
  --cal-violet-bg: rgba(139, 117, 196, .20);
}
.krs-status-root * { box-sizing: border-box; margin: 0; padding: 0; }

.krs-status-root .krs-board {
  background: var(--bg-board) !important;
  border: 1px solid var(--line-strong); border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .18);
  padding: 11px 14px; display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}
.krs-micro-label { display: block; color: var(--muted-2); font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

/* ═══ 顶栏（仅时间+日期+天气，宽敞不挤压） ═══ */
.krs-top-nav-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; flex-wrap: nowrap; padding-bottom: 9px; border-bottom: 1px solid var(--line);
}
.krs-status-root.krs-collapsed .krs-top-nav-bar { padding-bottom: 7px; }
.krs-nav-tabs { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.krs-nav-tab {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 9px; color: var(--muted); font-size: 11.5px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; transition: all .2s ease; white-space: nowrap;
}
.krs-nav-tab .tab-num { font-family: var(--font-mono); font-size: 8.5px; color: var(--muted-2); }
.krs-nav-tab .tab-text { font-family: var(--font-display); font-weight: 600; }
.krs-nav-tab:hover { color: var(--paper); border-color: var(--line-strong); }
.krs-nav-tab.active { background: rgba(166, 79, 104, .16); border-color: var(--rose); color: var(--rose-deep); }
.krs-nav-tab.active .tab-num { color: var(--rose); font-weight: 700; }
.krs-nav-badge { background: rgba(166, 79, 104, .18); border-radius: 99px; padding: 0 5px; font-family: var(--font-mono); font-size: 9px; color: var(--rose-deep); font-weight: 700; }

.krs-datetime {
  display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px;
  padding: 3px 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 11px; color: var(--muted); white-space: nowrap;
  min-width: 0; flex: 0 1 auto; overflow: hidden;
}
.krs-dt-time { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; color: var(--rose-deep); flex-shrink: 0; }
.krs-dt-date { flex-shrink: 0; font-family: var(--font-mono); font-size: 10.5px; }
.krs-dt-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
.krs-dt-weather-icon { display: inline-flex; width: 13px; height: 13px; color: var(--gold); flex-shrink: 0; }
.krs-dt-weather-icon svg { width: 13px; height: 13px; }
.krs-dt-weather { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper-soft); font-weight: 500; }

.krs-nav-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.krs-pill, .krs-collapse-btn {
  font-size: 10.5px; padding: 4px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface-1);
  color: var(--paper-soft); cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
  transition: all .2s ease; font-weight: 600; white-space: nowrap;
}
.krs-pill:hover, .krs-collapse-btn:hover { border-color: var(--rose); color: var(--rose-deep); }
.krs-status-root.krs-editing .krs-pill.edit-toggle-btn { background: rgba(56, 111, 100, .2) !important; border-color: var(--cyan) !important; color: var(--cyan) !important; }

/* 折叠态微缩 HUD（包含地点） */
.krs-mini-hud { display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 0; font-size: 11px; flex-wrap: wrap; }
.krs-status-root.krs-collapsed .krs-mini-hud { display: flex !important; }
.krs-status-root.krs-collapsed .cg-hub-btn { display: none !important; }
.krs-mh-left, .krs-mh-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.krs-mh-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--rose); }
.krs-mh-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 10.5px; color: var(--paper-soft); }
.krs-mh-chip b { color: var(--rose-deep); font-family: var(--font-mono); }
.krs-mh-chip.loc b { color: var(--cyan); font-family: var(--font-sans); }

.krs-stage-container { height: 486px; max-height: 486px; width: 100%; position: relative; overflow: hidden; }
.krs-status-root.krs-collapsed .krs-stage-container { display: none !important; }
.krs-pane-scroll-inner { height: 100%; max-height: 486px; overflow-y: auto; overflow-x: hidden; padding-right: 3px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.krs-tab-pane { display: none; width: 100%; height: 100%; }
.krs-tab-pane.active { display: block; animation: krsTabFade .22s ease both; }
@keyframes krsTabFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ═══ 侧边栏：极简顶部[展开]条 + 竖条头像 ═══ */
.gw-master-detail {
  display: grid; grid-template-columns: 185px minmax(0, 1fr); gap: 10px; height: 100%; overflow: hidden;
  transition: grid-template-columns .22s ease;
}
.gw-master-detail.is-slim {
  grid-template-columns: 64px minmax(0, 1fr);
}
.gw-side-list {
  background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px;
  padding: 6px 5px; display: flex; flex-direction: column; gap: 6px; height: 100%; overflow: hidden;
}

.gw-sprite-tuner {

}
.krs-status-root.krs-editing .gw-sprite-tuner.is-open { display: flex; }
.gw-st-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--rose-deep); margin-bottom: 1px; }
.gw-st-close { cursor: pointer; padding: 0 4px; color: #ccc; font-size: 11px; }
.gw-st-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; white-space: nowrap; min-width: 0; }
.gw-st-row > span { flex-shrink: 0; }
.gw-st-row input[type="range"] { flex: 1; min-width: 0; height: 4px; accent-color: var(--rose); cursor: pointer; }

.krs-sc-monogram {
  width: 100%; height: 100%; display: grid; place-items: center;

}
.gw-sort-btn {
  width: 100%; height: 26px; border: 1px dashed var(--line-strong); border-radius: 8px;

  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;

}
.gw-sort-btn:hover { border-color: var(--rose); color: var(--rose-deep); }
.gw-sort-btn.is-sorting { background: var(--rose); border-style: solid; border-color: var(--rose); color: #fff; }

.gw-drag-grip {

}
.krs-slider-card.is-drag-over, .krs-asset-slider-card.is-drag-over {

}
.gw-sort-arr {

}

.krs-h-badge-stack { position: absolute; left: 7px; right: 7px; bottom: 7px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; }
.krs-h-state-tag { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: rgba(15,18,26,.82); color: #fff; backdrop-filter: blur(4px); }

.krs-heroine-right-col {
  display: flex; flex-direction: column; justify-content: space-between;
  gap: 6px; min-width: 0; height: 100%; overflow-y: auto; padding-right: 2px;
}

.krs-heroine-bars { display: grid; grid-template-columns: 1fr; gap: 5px; }

.gw-axis-ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-2); }

.krs-heroine-meta-grid { display: grid; grid-template-columns: .75fr 1.65fr; gap: 7px; }

/* ═══ 03 · 生涯页：全卡统一同色系深浅变种系统 ═══ */

.pdr-embedded-map-container { height: 100%; width: 100%; border-radius: 15px; overflow: hidden; border: 1px solid var(--line-strong); position: relative; }

.pdr-node-icon-box { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: var(--surface-1); border: 2px solid var(--rose); color: var(--paper); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
.pdr-node-label { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--paper); background: var(--surface-1); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-strong); white-space: nowrap; }

/* ══════════════════════════════════════════════════════════════════
 * 📖 剧情控制器（扩展开关 + 作品主线章节推进）
 * 使用弹窗内局部主题变量，亮色 / 暗色自动适配
 * ══════════════════════════════════════════════════════════════════ */
.krs-plot-window {
  width: min(96vw, 1040px) !important; max-height: 92vh !important;
  --paper: #2b211c; --paper-soft: #4a3a30;
  --muted: rgba(43, 33, 28, .70); --muted-2: rgba(43, 33, 28, .48);
  --line: rgba(91, 65, 49, .13); --line-strong: rgba(91, 65, 49, .25);
  --rose: #a64f68; --rose-deep: #8c3e55; --violet: #75619c;
  --cyan: #386f64; --gold: #8c6630; --danger: #b34545;
  --surface-1: rgba(255, 252, 247, .96); --surface-2: rgba(255, 253, 249, .94);
  --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --font-mono: "SFMono-Regular", "Consolas", monospace;
  color: var(--paper) !important; background: #fbf5ec !important;
}
.krs-plot-window.krs-plot-dark {
  --paper: #f4f0e7; --paper-soft: #dfd8cc;
  --muted: rgba(239, 234, 224, .68); --muted-2: rgba(239, 234, 224, .45);
  --line: rgba(241, 235, 223, .11); --line-strong: rgba(241, 235, 223, .22);
  --rose: #ff92a8; --rose-deep: #ffb4c4; --violet: #b3a7ff;
  --cyan: #7ce7da; --gold: #e7c48b; --danger: #ff7f86;
  --surface-1: rgba(20, 25, 40, .90); --surface-2: rgba(15, 19, 32, .88);
  background: #101624 !important; color: #f4f0e7 !important;
}
.krs-plot-window.krs-plot-dark .krs-cg-topbar { border-bottom-color: rgba(241, 235, 223, .14) !important; }
.krs-plot-window.krs-plot-dark .krs-cg-close-btn { color: #9aa3b5 !important; }
.krs-plot-tabs {
  display: flex; gap: 4px; padding: 0 18px; flex-shrink: 0;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.krs-plot-tab {
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  padding: 9px 20px; border: 0; background: none; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; transition: color .18s, border-color .18s;
}
.krs-plot-tab:hover { color: var(--paper); }
.krs-plot-tab.active { color: var(--rose-deep); border-bottom-color: var(--rose); font-weight: 700; }
.krs-plot-body {
  padding: 14px 18px 10px; overflow-y: auto; overflow-x: hidden;
  max-height: calc(92vh - 150px); scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.krs-plot-body::-webkit-scrollbar { width: 6px; }
.krs-plot-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
.krs-plot-body.grid-ext {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
  gap: 10px; align-content: start;
}
.krs-plot-body.grid-story {
  display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; gap: 10px;
}
.krs-plot-ext-sec {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 9px;
  margin: 2px 0 0; padding: 0 1px; font-family: var(--font-display);
  font-size: 11px; letter-spacing: .08em; color: var(--gold); font-weight: 700; white-space: nowrap;
}
.krs-plot-ext-sec::after {
  content: ""; flex: 1 1 auto; height: 1px; min-width: 24px;
  background: linear-gradient(90deg, var(--line-strong), transparent);
}
.krs-plot-tile {
  position: relative; aspect-ratio: 1.18 / 1; min-height: 0; border: 1.5px solid var(--line-strong);
  border-radius: 12px; background-color: #201a27; background-position: center 22%;
  background-size: cover; background-repeat: no-repeat; overflow: hidden; cursor: pointer;
  text-align: left; font-family: inherit; color: #fff; padding: 10px 12px 11px;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.krs-plot-tile::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,6,14,.04) 0%, rgba(8,6,14,.20) 28%, rgba(8,6,14,.78) 62%, rgba(8,6,14,.96) 100%);
}
.krs-plot-tile.off::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: rgba(8,6,14,.38);
}
.krs-plot-tile > * { position: relative; z-index: 1; }
.krs-plot-tile:hover { transform: translateY(-2px); border-color: var(--rose); box-shadow: 0 8px 20px rgba(20,10,18,.28); }
.krs-plot-tile.on { border-color: var(--rose); box-shadow: 0 0 0 1px rgba(166,79,104,.18), 0 6px 16px rgba(20,10,18,.18); }

.krs-plot-tile-state {
  position: absolute; top: 8px; right: 9px; z-index: 2; font-size: 9px; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(255,255,255,.24);

}

.krs-plot-tile-name {
  display: block; font-family: var(--font-display); font-size: 13px; font-weight: 700;

.krs-plot-tile-desc {

.krs-plot-tile-count { margin-top: 5px; font-family: var(--font-mono); font-size: 8.5px; color: rgba(255,255,255,.62); }

.krs-plot-card {
  flex: 0 1 calc(50% - 5px); min-width: 0; display: flex; flex-direction: column;

}
.krs-plot-card.open { border-color: rgba(166,79,104,.55); box-shadow: 0 6px 18px rgba(60,30,40,.08); }

.krs-plot-card-head {
  width: 100%; min-height: 62px; border: 0; padding: 8px 12px; display: flex; align-items: center;
  gap: 10px; background-color: #201a27; background-size: cover; background-position: center 22%;
  position: relative; cursor: pointer; color: #fff; text-align: left; font-family: inherit; flex: 0 0 auto;
}
.krs-plot-card-head::before {

}
.krs-plot-card-head > * { position: relative; z-index: 1; }
.krs-plot-card:not(.open) .krs-plot-card-head { filter: grayscale(.75) brightness(.62); }
.krs-plot-card-name {

  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.krs-plot-card-state {
  font-size: 9.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(255,255,255,.24);
  color: #e6dbe6; white-space: nowrap; background: rgba(10,8,14,.34);
}
.krs-plot-card.on .krs-plot-card-state { color: #ffe6ed; border-color: rgba(255,146,168,.66); }
.krs-plot-card.done .krs-plot-card-state { color: #d6f0e7; border-color: rgba(124,231,218,.55); }
.krs-plot-card-arrow { font-size: 12px; color: #e9d6c8; }
.krs-plot-card-body { display: none; padding: 0 12px 11px; }
.krs-plot-card.open .krs-plot-card-body { display: block; }
.krs-plot-enabled {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 11px; color: var(--cyan); padding: 8px 0 6px; border-bottom: 1px dashed var(--line);
}

.krs-plot-close-story {
  font-family: inherit; font-size: 10px; color: var(--rose-deep); border: 1px solid rgba(166,79,104,.35);
  background: rgba(166,79,104,.06); border-radius: 99px; padding: 2px 9px; cursor: pointer; white-space: nowrap;
}
.krs-plot-close-story:hover { color: #fff; background: var(--rose); border-color: var(--rose); }
.krs-plot-progress { display: flex; gap: 3px; margin: 8px 0 7px; }
.krs-plot-progress span { flex: 1 1 0; height: 4px; border-radius: 2px; background: var(--line); }
.krs-plot-progress span.on { background: linear-gradient(90deg, var(--rose), var(--violet)); }
.krs-plot-story-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.krs-plot-chapter-name {
  font-family: var(--font-display); font-size: 12.5px; color: var(--paper); font-weight: 700;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.krs-plot-chapter-order { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); flex: 0 0 auto; }
.krs-plot-chapter-order button {

}

.krs-plot-stage, .krs-plot-next {

}
.krs-plot-stage b, .krs-plot-next b { flex: 0 0 54px; color: var(--gold); font-weight: 700; }
.krs-plot-stage span, .krs-plot-next span { flex: 1 1 auto; min-width: 0; word-break: break-word; }
.krs-plot-warn { font-size: 10px; color: var(--danger); padding-top: 4px; }
.krs-plot-hint {
  font-size: 10.5px; color: var(--muted); padding: 6px 18px 12px; border-top: 1px solid var(--line);
  background: var(--surface-2); flex-shrink: 0;
}
/* 暗色模式变量兼容弹窗外层挂类名 */
.krs-plot-dark .krs-plot-window {
  --paper: #f4f0e7; --paper-soft: #dfd8cc;
  --muted: rgba(239, 234, 224, .68); --muted-2: rgba(239, 234, 224, .45);
  --line: rgba(241, 235, 223, .11); --line-strong: rgba(241, 235, 223, .22);
  --rose: #ff92a8; --rose-deep: #ffb4c4; --violet: #b3a7ff;
  --cyan: #7ce7da; --gold: #e7c48b; --danger: #ff7f86;
  --surface-1: rgba(20, 25, 40, .92); --surface-2: rgba(15, 19, 32, .90);
  background: #101624 !important; color: #f4f0e7 !important;
}

/* 弹窗高度与滚动彻底解锁（兼容手机 dvh + 触摸滚动） */
.krs-plot-window { max-height: 90vh !important; max-height: 90dvh !important; }
.krs-plot-searchbar {
  display: flex; align-items: center; gap: 8px; padding: 8px 18px;

}
.krs-plot-search-input {

}

.krs-plot-body {
  flex: 1 1 auto !important; min-height: 0 !important;
  overflow-y: auto !important; overflow-x: hidden !important;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  max-height: calc(90vh - 180px) !important;
  max-height: calc(90dvh - 180px) !important;
}
.krs-plot-body.is-stack { display: block !important; }
.krs-plot-body.is-stack > * + * { margin-top: 12px; }

/* 剧情页外部活跃区与空状态提示 */
.krs-plot-empty-box {

}

@keyframes krsPlotPopIn {
  0% { opacity: 0; transform: translateY(10px) scale(.98); box-shadow: 0 0 0 3px rgba(166,79,104,.45); }
  100% { opacity: 1; transform: none; box-shadow: 0 6px 18px rgba(60,30,40,.08); }

/* 📦 剧情收纳盒 */

/* 收纳盒内快捷「▶ 开启」按钮 */

  padding: 4px 11px; border-radius: 99px; border: 1px solid rgba(255,180,196,.65);

  /* 默认立绘优先级：衣装① -> 校园制服 -> 大立绘 -> 其他第一套 -> 常态头像 */
  function getDefaultStage(entry) {
    if (!entry) return '';
    const o = entry.outfits || {};
    return o['衣装①'] || o['校园制服'] || o['大立绘'] || Object.values(o)[0] || entry.stage || '';
  }

  function normOutfitStr(str) {
    return String(str || '').trim()
      .replace(/衣装\s*[1１一]/g, '衣装①')
      .replace(/衣装\s*[2２二]/g, '衣装②')
      .replace(/衣装\s*[3３三]/g, '衣装③')
      .replace(/衣装\s*[4４四]/g, '衣装④');
  }

  function matchOutfitUrl(entry, dressRaw) {
    if (!entry || !entry.outfits) return '';
    const o = entry.outfits;
    const keys = Object.keys(o);
    if (!keys.length) return '';

    const raw = String(dressRaw || '').trim();
    if (!raw) return '';

    const colonMatch = raw.match(/^([^:：]{1,24})[:：]\s*(.*)$/);
    const tagPart = normOutfitStr(colonMatch ? colonMatch[1] : raw);
    const fullNorm = normOutfitStr(raw);

    function tryMatch(txt) {
      if (!txt) return '';
      if (o[txt]) return o[txt];

      const ym = txt.match(/衣装[①②③④]/);
      if (ym) {
        const yTag = ym[0];
        if (o[yTag]) return o[yTag];
        const prefixKey = keys.find(k => k.startsWith(yTag));
        if (prefixKey) return o[prefixKey];
        return '';
      }

      if (txt.includes('校园制服') || txt === '校服' || txt === '制服') {
        if (o['校园制服']) return o['校园制服'];
      }

      for (const k of keys) {
        const sub = k.replace(/^衣装[①②③④]/, '');
        if (txt.includes(k) || (sub.length >= 2 && txt.includes(sub))) return o[k];
      }
      if (txt.includes('睡衣') && o['衣装②散发睡衣']) return o['衣装②散发睡衣'];
      if (txt.includes('连帽衫') && o['衣装②校园制服带上粉色连帽衫']) return o['衣装②校园制服带上粉色连帽衫'];
      if (txt.includes('游星') && o['大藏游星装']) return o['大藏游星装'];
      if (txt.includes('童年') && (o['童年里奈'] || o['童年禀'])) return o['童年里奈'] || o['童年禀'];
      return '';
    }

    return tryMatch(colonMatch ? tagPart : fullNorm);
  }

  function rawUrlOf(u) {

  function stageChainOf(name, dressRaw) {
    const entry = findCastEntry(name);
    if (!entry) return [];
    const matched = matchOutfitUrl(entry, dressRaw);
    const defStage = getDefaultStage(entry);
    if (!matched && !defStage && !entry.stage) return [];
    const base = [];
    [matched, defStage, entry.stage].forEach((u) => {
      if (u && u !== FALLBACK_IMG && base.indexOf(u) < 0) base.push(u);
    });
    const out = [];
    base.forEach((u) => {
      out.push(u);
      const r = rawUrlOf(u);
      if (r && out.indexOf(r) < 0) out.push(r);
    });
    return out;
  }

  /* ═══ MVU 变量读写桥 ═══ */
  function rs() {
    const scopes = [window];
    try { if (window.parent && window.parent !== window) scopes.push(window.parent); } catch(e){}
    try { if (window.top && window.top !== window) scopes.push(window.top); } catch(e){}

  }

  function safeGet(obj, path, def) {
    if (!obj || typeof path !== 'string' || !path) return def;
    const parts = path.split('.');
    let curr = obj;
    for (const p of parts) {
      if (curr === null || curr === undefined || typeof curr !== 'object') return def;
      curr = curr[p];
    }
    return curr !== undefined ? curr : def;
  }

  function safeSet(obj, path, val) {
    if (!obj) return;
    const parts = path.split('.');
    let curr = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!curr[p] || typeof curr[p] !== 'object') curr[p] = {};
      curr = curr[p];
    }
    curr[parts[parts.length - 1]] = val;
  }

  async function mutateMvuStat(changeCallback) {
    let mvu = null;
    const scopes = [window, window.parent, window.top];
    for (const s of scopes) {
      try { if (s && s.Mvu && typeof s.Mvu.getMvuData === 'function') { mvu = s.Mvu; break; } } catch(_) {}
    }
    if (mvu) {
      try {
        const opts = { type: 'message', message_id: 'latest' };
        const cur = mvu.getMvuData(opts);
        if (cur) {
          const next = JSON.parse(JSON.stringify(cur));
          changeCallback(next.stat_data || next);
          await mvu.replaceMvuData(next, opts);
        }
      } catch(e) { console.warn('Mvu replace failed', e); }
    }
    const sd = rs();
    if (sd) changeCallback(sd);
  }

  /* 变量微调弹窗（支持 text / number / textarea / boolean） */
  function openEditor(path, label, type) {
    const sd = rs();
    if (!sd) return;
    const curVal = safeGet(sd, path, type === 'boolean' ? false : '');
    let modal = document.getElementById('krs-fast-editor');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'krs-fast-editor';
    modal.className = 'krs-vedit-backdrop';

    let inputHtml = '';
    if (type === 'boolean') {
      inputHtml = `
        <select class="krs-vedit-select" id="kf-val">
          <option value="true" ${curVal ? 'selected' : ''}>true（开启 / 是）</option>
          <option value="false" ${!curVal ? 'selected' : ''}>false（关闭 / 否）</option>
        </select>
      `;
    } else if (type === 'textarea') {
      inputHtml = `<textarea class="krs-vedit-textarea" id="kf-val">${escHtml(curVal)}</textarea>`;
    } else {
      inputHtml = `<input type="${type === 'number' ? 'number' : 'text'}" class="krs-vedit-input" id="kf-val" value="${escHtml(curVal)}">`;
    }

    modal.innerHTML = `
      <div class="krs-vedit-pane">
        <div class="krs-vedit-head">
          <b>✏️ 变量微调 · ${escHtml(label)}</b>

          <button type="button" class="krs-vbtn cancel" id="kf-cancel">取消</button>
          <button type="button" class="krs-vbtn save" id="kf-save">保存</button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('#kf-close').onclick = close;
    modal.querySelector('#kf-cancel').onclick = close;
    const clearBtn = modal.querySelector('#kf-clear');
    if (clearBtn) clearBtn.onclick = () => { modal.querySelector('#kf-val').value = ''; };
    modal.querySelector('#kf-save').onclick = async () => {
      const raw = modal.querySelector('#kf-val').value;
      let v = raw.trim();
      if (type === 'number') v = parseFloat(v) || 0;

      await mutateMvuStat(root => safeSet(root, path, v));
      close();

    const dEl = document.getElementById('krs-dt-date');
    const wEl = document.getElementById('krs-dt-weather');
    const iEl = document.getElementById('krs-dt-wicon');
    const rawT = String(safeGet(sd, '世界.时间', '') || '').trim();
    const rawD = String(safeGet(sd, '世界.日期', '') || '').trim();
    const rawW = String(safeGet(sd, '世界.天气', '') || '').trim();

    let shortD = rawD.replace(/^\d{4}年/, '').replace('星期', '周');
    const dm = rawD.match(/(\d{1,2})月(\d{1,2})日\s*(?:星期|周)?([一二三四五六日天])?/);
    if (dm) shortD = `${dm[1].padStart(2,'0')}/${dm[2].padStart(2,'0')}${dm[3] ? ' 周'+dm[3] : ''}`;

    if (tEl) tEl.textContent = rawT.replace('时', ':').replace('分', '') || '--:--';
    if (dEl) dEl.textContent = shortD || '2018';
    if (wEl) wEl.textContent = rawW || '晴';
    if (iEl) iEl.innerHTML = rawW ? krsWeatherIcon(rawW) : '';
    if (box) box.title = `${rawD} ${rawT} ｜ 天气：${rawW}`;
  }

  function formatDressHtml(raw) {
    const s = String(raw || '').trim();
    if (!s) return '<span style="color:var(--muted-2)">常服</span>';
    const m = s.match(/^([^:：]{1,16})[:：]\s*(.+)$/);
    if (m) return `<span class="krs-dress-tag">${escHtml(m[1])}</span><span>${escHtml(m[2])}</span>`;
    return escHtml(s);
  }

  function renderFiveSegs(pct) {
    const lit = Math.max(1, Math.min(5, Math.round((pct || 20) / 20)));
    let s = '<div class="gw-seg-row">';
    for (let i = 1; i <= 5; i++) s += `<span class="gw-seg ${i <= lit ? 'on' : ''}"></span>`;
    return s + '</div>';
  }

  function renderSmartCareerField(basePath, activeAssetName, k, val) {
    const isNum = typeof val === 'number';
    const strVal = String(val);

    if (/粉丝|人气|关注/.test(k)) {
      const fans = Math.max(0, Number(val) || 0);
      const tier = fans >= 100000 ? '🔥 主流出道级' : (fans >= 10000 ? '🌟 万粉人气王' : (fans >= 1000 ? '✨ 千粉新星' : (fans >= 100 ? '🌱 小有关注' : '🎸 地下初创')));
      const pct = Math.min(100, Math.round((Math.log10(fans + 1) / 5) * 100));
      return `
        <div class="krs-cf-card kw-fans">
          <span class="krs-cf-lbl"><span>📈 ${escHtml(k)}</span><span>${tier}</span></span>
          <div class="gw-fans-num" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}" data-krs-type="number">${fans.toLocaleString('ja-JP')} <small style="font-size:10px;font-weight:500;">FOLLOWER</small></div>
          <div class="krs-hbar-track" style="margin-top:4px;"><div class="krs-hbar-fill" style="width:${pct}%;background:var(--violet);"></div></div>
        </div>
      `;
    }

    if (/经费|产出|资金|俸禄|津贴|收入/.test(k)) {
      const disp = isNum ? formatYen(val) : strVal;
      return `
        <div class="krs-cf-card kw-money">
          <span class="krs-cf-lbl"><span>💴 ${escHtml(k)}</span><span>TREASURY</span></span>
          <div class="gw-money-num" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}" data-krs-type="${isNum ? 'number' : 'text'}">${escHtml(disp)}</div>
        </div>
      `;
    }

    if (/目标|宿命|试炼|案件|赛事|开演/.test(k)) {
      return `
        <div class="krs-cf-card kw-goal ${strVal.length > 20 ? 'wide' : ''}">
          <span class="krs-cf-lbl"><span>🎯 ${escHtml(k)}</span><span>TARGET</span></span>
          <div class="krs-cf-val" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}" data-krs-type="textarea">${escHtml(strVal)}</div>
        </div>
      `;
    }

    if (/期限|截至|截止|时间|日程/.test(k)) {
      return `
        <div class="krs-cf-card kw-deadline">
          <span class="krs-cf-lbl"><span>⏰ ${escHtml(k)}</span><span>DEADLINE</span></span>
          <div class="krs-cf-val" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}">${escHtml(strVal)}</div>
        </div>
      `;
    }

    if (/风评|反响|治安|口碑/.test(k)) {
      return `
        <div class="krs-cf-card kw-repute wide">
          <span class="krs-cf-lbl"><span>💬 ${escHtml(k)}</span><span>PUBLIC ECHO</span></span>
          <div class="krs-cf-val" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}" data-krs-type="textarea">“${escHtml(strVal)}”</div>
        </div>
      `;
    }

    const isWide = strVal.length > 24;
    return `
      <div class="krs-cf-card ${isWide ? 'wide' : ''}">
        <span class="krs-cf-lbl"><span>✦ ${escHtml(k)}</span></span>
        <div class="krs-cf-val ${isNum ? 'num' : ''}" data-krs-edit="${basePath}.${k}" data-krs-label="${activeAssetName} · ${k}" data-krs-type="${isNum ? 'number' : (isWide ? 'textarea' : 'text')}">${escHtml(isNum ? val.toLocaleString('ja-JP') : strVal)}</div>
      </div>
    `;
  }

  /* ═══ 主渲染函数 ═══ */
  function renderAll() {

    root.querySelector('.char-count-badge').textContent = charKeys.length;

    /* ── 02 · 主角档案 ── */
    root.querySelector('.hero-avatar-img').src = krsHeroAvatar(uName);

    root.querySelector('.hero-age-text').textContent = uAge;

    const crossBadge = root.querySelector('.hero-cross-badge');

    if (futaBadge) { futaBadge.classList.toggle('is-on', uFuta); futaBadge.textContent = uFuta ? '⚧ Futa:是' : '⚧ Futa:否'; }

    const rawId = String(safeGet(sd, 'user.身份', '学生') || '学生');

    root.querySelector('.hero-gold-text').textContent = formatYen(uWallet);
    root.querySelector('.hero-loc-text').textContent = curLoc;
    root.querySelector('.hero-status-text').textContent = safeGet(sd, 'user.状态', '状态平稳') || '状态平稳';

    root.querySelector('.hero-repute-text').textContent = safeGet(sd, 'user.风评', '暂无特别风评') || '暂无特别风评';
    root.querySelector('.hero-body-text').textContent = safeGet(sd, 'user.身体', '') || '无特殊身体记录';

    const lustVal = Math.min(200, Math.max(0, parseInt(safeGet(sd, 'user.淫乱度', 0)) || 0));
    let lColor = 'var(--cyan)', lStage = '抵抗', lIdx = 0;
    if (lustVal >= 120) { lColor = 'var(--rose)'; lStage = '沉溺'; lIdx = 3; }
    else if (lustVal >= 80) { lColor = 'var(--violet)'; lStage = '适应'; lIdx = 2; }
    else if (lustVal >= 40) { lColor = 'var(--gold)'; lStage = '妥协'; lIdx = 1; }
    root.querySelector('.hero-lust-stage').textContent = `${lustVal} · ${lStage}`;
    root.querySelector('.hero-lust-bar').style.width = `${(lustVal / 200) * 100}%`;
    root.querySelector('.hero-lust-bar').style.background = lColor;
    root.querySelectorAll('#hero-lust-nodes span').forEach((sp, idx) => sp.classList.toggle('on', idx === lIdx));

    const previewBox = root.querySelector('#hero-career-preview');
    if (previewBox) {
      if (careerKeys.length === 0) {
        previewBox.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:14px;color:var(--muted-2);font-size:11.5px;">尚未登记任何生涯（如学生卡、社团、SNS乐队、超凡能力或房产）。</div>';
      } else {
        previewBox.innerHTML = careerKeys.map(cName => {
          const item = careers[cName] || {};
          const type = item['类型'] || '生涯';
          const icon = getCareerIcon(type, cName);
          const sub = item['所属学校'] || item['社团目标'] || item['定位与担当'] || item['战力评级'] || item['部门与职衔'] || item['状态'] || item['位置'] || type;
          return `
            <button type="button" class="krs-hcp-card" data-jump-career="${escHtml(cName)}">
              <div class="krs-hcp-icon">${icon}</div>
              <div class="krs-hcp-copy">
                <div class="krs-hcp-title">${escHtml(cName)}</div>
                <div class="krs-hcp-sub">${escHtml(sub)}</div>
              </div>
            </button>
          `;
        }).join('');
      }
    }

    /* ── 03 · 生涯与资产 ── */
    const aCatBar = root.querySelector('#assets-category-bar');
    const aSlider = root.querySelector('#assets-slider');
    const aStage = root.querySelector('#assets-stage');

    if (aCatBar && aSlider && aStage) {
      if (careerKeys.length === 0) {
        aCatBar.innerHTML = '';
        aSlider.innerHTML = '<div style="color:var(--muted-2);font-size:11px;padding:6px;text-align:center;">空</div>';
        aStage.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted-2);font-size:12.5px;">随着剧情推进，入学学生卡、加入的社团、组建的乐队、觉醒的超凡能力或名下房产都会自动收录于此。</div>';
      } else {
        const counts = { '全部': careerKeys.length };
        careerKeys.forEach(k => {
          const cat = normalizeCareerCat((careers[k] || {})['类型']);
          counts[cat] = (counts[cat] || 0) + 1;
        });
        const allCats = ['全部', '学生卡', '社团', '企划', '超凡', '公职', '家门', '竞技', '资产'].filter(c => c === '全部' || counts[c]);
        if (!allCats.includes(activeAssetCat)) activeAssetCat = '全部';

        aCatBar.innerHTML = allCats.map(cat => `
          <button type="button" class="krs-asset-cat-pill ${activeAssetCat === cat ? 'active' : ''}" data-asset-cat="${escHtml(cat)}">
            <span>${escHtml(cat)} ${counts[cat] || 0}</span>
          </button>
        `).join('');

        const filteredKeys = careerKeys.filter(k => {
          if (activeAssetCat === '全部') return true;
          return normalizeCareerCat((careers[k] || {})['类型']) === activeAssetCat;
        });
        if (filteredKeys.length > 0 && !filteredKeys.includes(activeAssetName)) activeAssetName = filteredKeys[0];

        aSlider.innerHTML = filteredKeys.map(aName => {
          const a = careers[aName] || {};
          const isActive = (aName === activeAssetName);
          const icon = getCareerIcon(a['类型'], aName);
          const badgeTxt = a['规模'] ? `${a['规模']}阶` : (a['年级'] || a['战力评级'] || '');
          return `
            <div class="krs-asset-slider-card ${isActive ? 'active' : ''}" data-select-asset="${escHtml(aName)}" draggable="${isSortMode}" data-drag-kind="career" data-drag-key="${escHtml(aName)}" title="${escHtml(aName)}">
              <span class="gw-corner-bubble">${a['规模'] || '✦'}</span>
              <span class="gw-drag-grip" title="按住拖动排序">⠿</span>
              <div class="krs-asc-icon-box">${icon}</div>
              <div class="krs-asc-info">
                <span class="krs-asc-name">${escHtml(aName)}</span>
                <span class="krs-asc-sub">${escHtml(a['类型'] || '生涯')}${badgeTxt ? ' · ' + escHtml(badgeTxt) : ''}</span>
              </div>
              <div class="gw-sort-controls">
                <span class="gw-sort-arr" data-move-career="${escHtml(aName)}" data-dir="-1" title="上移">▲</span>
                <span class="gw-sort-arr" data-move-career="${escHtml(aName)}" data-dir="1" title="下移">▼</span>
              </div>
            </div>
          `;
        }).join('');

        const curA = careers[activeAssetName] || {};
        const basePath = `${careerRootKey}.${activeAssetName}`;
        const cCat = normalizeCareerCat(curA['类型']);
        const icon = getCareerIcon(curA['类型'], activeAssetName);

        if (cCat === '学生卡') {
          aStage.innerHTML = `
            <div class="gw-student-id-card">
              <div class="gw-sid-ribbon">
                <b>🎓 雲ノ下連合学園 · 学生証 / STUDENT ID CARD</b>

              <div class="gw-sid-body">
                <div class="gw-sid-photo">
                  <img src="${escHtml(krsHeroAvatar(uName))}" alt="">
                  <div class="gw-sid-seal">学籍<br>认证</div>
                </div>
                <div class="krs-career-fields-grid" style="flex:1;">
                  <div class="krs-cf-card">
                    <span class="krs-cf-lbl">🏫 所属学校 / 子校园</span>

                  <div class="krs-cf-card">

                  </div>
                  ${renderSmartCareerField(basePath, activeAssetName, '成绩与能力', curA['成绩与能力'] || '暂无测评记录')}
                  ${renderSmartCareerField(basePath, activeAssetName, '校内风评', curA['校内风评'] || '普通学生')}
                  ${renderSmartCareerField(basePath, activeAssetName, '下次考试时间', curA['下次考试时间'] || '未定')}
                </div>
              </div>
            </div>
          `;
        } else {
          const MEMBER_KEYS = ['社团成员', '成员', '住客', '分配', '同僚与下属', '门下侍从'];
          const SEQ_KEYS = ['建设序列', '技能序列'];
          const NAME_KEYS = ['社团名称', '企划名称', '名称'];
          const subTitleVal = curA['社团名称'] || curA['企划名称'] || curA['名称'] || '';
          const SKIP_KEYS = new Set(['类型', '规模', ...MEMBER_KEYS, ...SEQ_KEYS, ...NAME_KEYS]);

          const normalEntries = Object.keys(curA).filter(k => !SKIP_KEYS.has(k) && curA[k] !== '' && curA[k] !== null && curA[k] !== undefined);
          const fieldsHtml = normalEntries.map(k => renderSmartCareerField(basePath, activeAssetName, k, curA[k])).join('');

          let memBlocksHtml = '';
          MEMBER_KEYS.forEach(mk => {
            if (curA[mk] !== undefined) {
              const parsed = renderAssetMembers(curA[mk]);
              if (parsed || isEditMode) {
                memBlocksHtml += `
                  <div class="krs-asset-members-block">
                    <div class="krs-asset-mem-title" data-krs-edit="${basePath}.${mk}" data-krs-label="${activeAssetName} · ${mk}">👥 ${escHtml(mk)}</div>
                    <div class="krs-asset-mem-list">${parsed || '<span style="font-size:11px;color:var(--muted-2)">暂无成员记录</span>'}</div>

          let seqBlocksHtml = '';
          SEQ_KEYS.forEach(sk => {
            const seqObj = curA[sk];
            if (seqObj && typeof seqObj === 'object' && Object.keys(seqObj).length > 0) {
              const sKeys = Object.keys(seqObj);

                <div class="krs-asset-build-sec">

                  </div>
                </div>

            }

          aStage.innerHTML = `
            <div class="gw-career-board">
              <div class="gw-sid-ribbon cat-${escHtml(cCat)}">
                <b>
                  <span>${icon} ${escHtml(activeAssetName)}</span>
                  ${subTitleVal && subTitleVal !== activeAssetName ? `<span style="font-size:11px;opacity:.88;font-weight:400;">｜ ${escHtml(subTitleVal)}</span>` : ''}

                  <span data-krs-edit="${basePath}.类型" data-krs-label="生涯类型">【${escHtml(curA['类型'] || cCat)}】</span>
                  ${curA['规模'] !== undefined ? `<span data-krs-edit="${basePath}.规模" data-krs-label="规模 (1-8)" data-krs-type="number">★ ${curA['规模']}阶</span>` : ''}
                  <button type="button" class="krs-pill" data-del-asset="${escHtml(activeAssetName)}" style="background:rgba(0,0,0,.25);color:#fff;border-color:rgba(255,255,255,.3);padding:1px 7px;">清退</button>
                </div>
              </div>
              <div class="gw-cb-inner">
                <div class="krs-career-fields-grid">${fieldsHtml}</div>
                ${memBlocksHtml}
                ${seqBlocksHtml}
              </div>
            </div>
          `;
        }
      }
    }

    /* ── 01 · 角色关系（根据 角色.<名>.服装 变量动态切换立绘，不匹配回退 衣装①） ── */
    const slider = root.querySelector('#relations-char-slider');
    const stage = root.querySelector('#relations-char-stage');

    if (charKeys.length === 0) {
      slider.innerHTML = '<div style="color:var(--muted-2);font-size:11px;padding:6px;text-align:center;">空</div>';
      stage.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted-2);font-size:12.5px;">尚未与任何重要角色建立跨轮追踪档案。</div>';
    } else {
      if (!activeCharName || !chars[activeCharName]) activeCharName = charKeys[0];

      slider.innerHTML = charKeys.map(cName => {
        const c = chars[cName] || {};
        const isActive = (cName === activeCharName);
        const isPresent = !!c['在场'];
        const intim = Math.min(400, Math.max(0, parseInt(c['亲密程度']) || 0));
        const firstId = String(c['关系'] || c['身份'] || '').split('、')[0];
        const bubbleIcon = intim >= 200 ? '♡' : (isPresent ? '✦' : '♪');
        const bubbleCls = intim >= 200 ? 'love' : (isPresent ? 'on' : '');

      const curC = chars[activeCharName] || {};

              <div class="krs-tri-card"><b>👁️ 体貌</b><p>${escHtml(triAppear)}</p></div>

    /* ── 04 · 交互式日程月历 ── */
