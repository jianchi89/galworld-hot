    window.selectPandoraSub = (p, s) => selectLocation(p, s);

    let scale = 0.58;
    const vRect = viewport.getBoundingClientRect();
    const vW = vRect.width || 880;
    const vH = vRect.height || 520;
    let panX = (vW / 2) - (1300 * scale);
    let panY = (vH / 2) - (820 * scale);

    function update() { canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

    let sx = 0, sy = 0, dragMoved = 0;
    const ptrs = new Map();
    viewport.onpointerdown = (e) => {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      dragMoved = 0;
      sx = e.clientX - panX;
      sy = e.clientY - panY;
    };
    window.addEventListener('pointermove', (e) => {
      if (!ptrs.has(e.pointerId)) return;
      dragMoved = Math.max(dragMoved, Math.abs(e.clientX - (sx + panX)) + Math.abs(e.clientY - (sy + panY)));
      panX = e.clientX - sx;
      panY = e.clientY - sy;
      update();
    });
    window.addEventListener('pointerup', (e) => ptrs.delete(e.pointerId));
    window.addEventListener('pointercancel', (e) => ptrs.delete(e.pointerId));
    viewport.addEventListener('click', (e) => { if (dragMoved > 8) { e.stopPropagation(); e.preventDefault(); } dragMoved = 0; }, true);

    viewport.onwheel = (e) => {
      e.preventDefault();
      const old = scale;
      scale = e.deltaY < 0 ? Math.min(1.6, scale * 1.14) : Math.max(0.32, scale / 1.14);
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      panX = mx - (mx - panX) * (scale / old);
      panY = my - (my - panY) * (scale / old);
      update();
    };

    document.getElementById('pdr-zoom-in').onclick = () => { scale = Math.min(1.6, scale * 1.2); update(); };
    document.getElementById('pdr-zoom-out').onclick = () => { scale = Math.max(0.32, scale / 1.2); update(); };
    document.getElementById('pdr-zoom-reset').onclick = () => {
      scale = 0.58;
      panX = (vW / 2) - (1300 * scale);
      panY = (vH / 2) - (820 * scale);
      update();
    };
    update();
    selectLocation("云下学园·中枢");
  };

  /* ═══ 事件绑定 ═══ */
  function bindEvents() {
    const root = document.querySelector('.krs-status-root');
    if (!root || root.dataset.bound) return;
    root.dataset.bound = 'true';

    try {
      if (localStorage.getItem('KRS_STATUS_DARK') === '1') {
        root.classList.add('krs-dark');
        const tb = root.querySelector('#krs-btn-theme');
        if (tb) {
          tb.querySelector('.theme-icon').textContent = '☀️';
          tb.querySelector('.theme-text').textContent = '亮色';
        }
      }
    } catch (_) {}

    try {
      const savedSlim = localStorage.getItem('KRS_SIDE_SLIM');
      if (savedSlim === '1' || savedSlim === '0') {
        isSideSlim = (savedSlim === '1');
        root.querySelectorAll('.gw-master-detail').forEach(el => el.classList.toggle('is-slim', isSideSlim));
      }
    } catch (_) {}

    let suppressTouchClick = false;
    root.addEventListener('click', async (e) => {
      if (suppressTouchClick) return;
      const themeBtn = e.target.closest('#krs-btn-theme');
      if (themeBtn) {
        const isDark = root.classList.toggle('krs-dark');
        themeBtn.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
        themeBtn.querySelector('.theme-text').textContent = isDark ? '亮' : '暗';
        try { localStorage.setItem('KRS_STATUS_DARK', isDark ? '1' : '0'); } catch (_) {}
        return;
      }

      if (e.target.closest('[data-Switch-tab="map"]')) {
        activeTab = 'map';
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'map'));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-map'));
        if (window.initEmbeddedMap) window.initEmbeddedMap();
        return;
      }

      

      if (e.target.closest('[data-open-tuner]')) { e.stopPropagation(); isTunerOpen = true; renderAll(); return; }
      if (e.target.closest('[data-close-tuner]')) { e.stopPropagation(); isTunerOpen = false; renderAll(); return; }
      if (e.target.closest('.gw-sprite-tuner')) { e.stopPropagation(); return; }

      if (e.target.closest('[data-toggle-sort]')) {
        isSortMode = !isSortMode;
        renderAll();
        return;
      }

      const moveCharBtn = e.target.closest('[data-move-char]');
      if (moveCharBtn) {
        e.stopPropagation();
        const sd = rs() || {};
        moveKeyInOrder(Object.keys(safeGet(sd, '角色', {}) || {}), 'KRS_CHAR_ORDER', moveCharBtn.getAttribute('data-move-char'), parseInt(moveCharBtn.getAttribute('data-dir')));
        renderAll(); return;
      }

      const moveCareerBtn = e.target.closest('[data-move-career]');
      if (moveCareerBtn) {
        e.stopPropagation();
        const sd = rs() || {};
        const cObj = safeGet(sd, 'user.生涯', null) || safeGet(sd, 'user.资产', {}) || {};
        moveKeyInOrder(Object.keys(cObj), 'KRS_CAREER_ORDER', moveCareerBtn.getAttribute('data-move-career'), parseInt(moveCareerBtn.getAttribute('data-dir')));
        renderAll(); return;
      }

      if (e.target.closest('[data-toggle-slim]')) {
        isSideSlim = !isSideSlim;
        root.querySelectorAll('.gw-master-detail').forEach(el => el.classList.toggle('is-slim', isSideSlim));
        try { localStorage.setItem('KRS_SIDE_SLIM', isSideSlim ? '1' : '0'); } catch (_) {}
        return;
      }

      const calDay = e.target.closest('[data-cal-day]');
      if (calDay) { calSelectedDate = calDay.getAttribute('data-cal-day'); renderAll(); return; }

      const calNav = e.target.closest('[data-cal-nav]');
      if (calNav) {
        calViewMonth += parseInt(calNav.getAttribute('data-cal-nav'));
        if (calViewMonth > 12) { calViewMonth = 1; calViewYear++; }
        if (calViewMonth < 1) { calViewMonth = 12; calViewYear--; }
        renderAll(); return;
      }

      const calToday = e.target.closest('[data-cal-goto-today]');
      if (calToday) {
        const tk = calToday.getAttribute('data-cal-goto-today');
        const p = tk.split('-').map(Number);
        calViewYear = p[0]; calViewMonth = p[1]; calSelectedDate = tk;
        renderAll(); return;
      }

      const calMode = e.target.closest('[data-cal-mode]');
      if (calMode) { calSubMode = calMode.getAttribute('data-cal-mode'); renderAll(); return; }

      const delCal = e.target.closest('[data-del-cal]');
      if (delCal) {
        const cid = delCal.getAttribute('data-del-cal');
        await mutateMvuStat(r => { if (r['世界'] && r['世界']['日历']) delete r['世界']['日历'][cid]; });
        renderAll(); return;
      }

      if (e.target.closest('#gw-btn-add-promise')) {
        const p = (calSelectedDate || '2018-04-09').split('-').map(Number);
        const defDate = `${p[0]}年${p[1]}月${p[2]}日`;
        const title = prompt('请输入新约定名称（4~12字，如：六月恋友竞赛）：');
        if (!title || !title.trim()) return;
        const content = prompt('请输入约定内容与判定条件：', '') || '双方约定的事项';
        const who = prompt('请输入相关者（如：美月×零）：', '零') || '零';
        const deadline = prompt('请输入约定日期：', defDate) || defDate;
        await mutateMvuStat(r => {
          if (!r['世界']) r['世界'] = {};
          if (!r['世界']['事件']) r['世界']['事件'] = {};
          r['世界']['事件'][title.trim()] = { 类型: '约定', 内容: content.trim(), 相关者: who.trim(), 期限: deadline.trim(), 状态: '进行中' };
        });
        renderAll(); return;
      }

      if (e.target.closest('.krs-plot-hub-btn')) { openPlotPanel(); return; }
      if (e.target.closest('.krs-lang-switch')) { await krsLangToggle(); return; }
      if (e.target.closest('.cg-hub-btn')) { openCgGalleryModal(null); return; }

      const heroCgBtn = e.target.closest('.cg-hero-btn, .cg-sprite-trigger');
      if (heroCgBtn) {
        if (heroCgBtn.classList.contains('cg-sprite-trigger') && isEditMode) return;
        openCgGalleryModal(heroCgBtn.getAttribute('data-cg-char') || activeCharName);
        return;
      }

      const jumpCareer = e.target.closest('[data-jump-career]');
      if (jumpCareer) {
        activeAssetName = jumpCareer.getAttribute('data-jump-career');
        activeAssetCat = '全部';
        activeTab = 'assets';
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'assets'));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-assets'));
        renderAll();
        return;
      }

      const tabBtn = e.target.closest('.krs-nav-tab');
      if (tabBtn) {
        activeTab = tabBtn.getAttribute('data-tab');
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b === tabBtn));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${activeTab}`));
        if (activeTab === 'map' && window.initEmbeddedMap) window.initEmbeddedMap();
        return;
      }

      const scCard = e.target.closest('[data-select-char]');
      if (scCard) { activeCharName = scCard.getAttribute('data-select-char'); renderAll(); return; }

      const catBtn = e.target.closest('[data-asset-cat]');
      if (catBtn) { activeAssetCat = catBtn.getAttribute('data-asset-cat'); renderAll(); return; }

      const saCard = e.target.closest('[data-select-asset]');
      if (saCard) { activeAssetName = saCard.getAttribute('data-select-asset'); renderAll(); return; }

      const editBtn = e.target.closest('.edit-toggle-btn');
      if (editBtn) {
        isEditMode = !isEditMode;
        renderAll();
        return;
      }

      if (isEditMode) {
        const editField = e.target.closest('[data-krs-edit]');
        if (editField) {
          e.preventDefault();
          e.stopImmediatePropagation();
          openEditor(
            editField.getAttribute('data-krs-edit'),
            editField.getAttribute('data-krs-label') || '变量',
            editField.getAttribute('data-krs-type') || 'text'
          );
          return;
        }
      }

      const ebRow = e.target.closest('.krs-eb-row');
      if (ebRow) {
        const wrap = ebRow.closest('.krs-eb-item-wrap');
        const k = wrap.getAttribute('data-event-name');
        if (openEventItemKeys.has(k)) openEventItemKeys.delete(k);
        else openEventItemKeys.add(k);
        wrap.classList.toggle('open');
        return;
      }

      const delChar = e.target.closest('[data-del-char]');
      if (delChar) {
        const target = delChar.getAttribute('data-del-char');
        if (confirm(`确定清退角色【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['角色']) delete r['角色'][target]; });
          activeCharName = '';
          renderAll();
        }
        return;
      }

      const delEv = e.target.closest('[data-del-event]');
      if (delEv) {
        const target = delEv.getAttribute('data-del-event');
        if (confirm(`确定清退事件【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['世界'] && r['世界']['事件']) delete r['世界']['事件'][target]; });
          renderAll();
        }
        return;
      }

      const delAsset = e.target.closest('[data-del-asset]');
      if (delAsset) {
        const target = delAsset.getAttribute('data-del-asset');
        if (confirm(`确定清退生涯【${target}】吗？`)) {
          await mutateMvuStat(r => {
            if (r['user'] && r['user']['生涯']) delete r['user']['生涯'][target];
            if (r['user'] && r['user']['资产']) delete r['user']['资产'][target];
          });
          activeAssetName = '';
          renderAll();
        }
        return;
      }

      const colBtn = e.target.closest('#krs-btn-collapse');
      if (colBtn) {
        const isCol = root.classList.toggle('krs-collapsed');
        colBtn.querySelector('.krs-collapse-text').textContent = isCol ? '展开' : '收起';
        colBtn.querySelector('.krs-collapse-icon').textContent = isCol ? '▼' : '▲';
        try { localStorage.setItem('KRS_STATUS_COLLAPSED', isCol ? '1' : '0'); } catch (_) {}
      }
    });

    root.addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-drag-key]');
      if (!card || !isSortMode) return;
      dragSrcKey = card.getAttribute('data-drag-key');
      dragKind = card.getAttribute('data-drag-kind');
    });
    root.addEventListener('dragover', (e) => {
      if (isSortMode && e.target.closest('[data-drag-key]')) e.preventDefault();
    });
    root.addEventListener('drop', (e) => {
      const targetCard = e.target.closest('[data-drag-key]');
      if (!targetCard || !isSortMode || !dragSrcKey) return;
      const destKey = targetCard.getAttribute('data-drag-key');
      const kind = targetCard.getAttribute('data-drag-kind');
      if (kind !== dragKind || destKey === dragSrcKey) return;
      const sd = rs() || {};
      if (kind === 'char') {
        moveKeyInOrder(Object.keys(safeGet(sd, '角色', {}) || {}), 'KRS_CHAR_ORDER', dragSrcKey, destKey);
      } else {
        const cObj = safeGet(sd, 'user.生涯', null) || safeGet(sd, 'user.资产', {}) || {};
        moveKeyInOrder(Object.keys(cObj), 'KRS_CAREER_ORDER', dragSrcKey, destKey);
      }
      dragSrcKey = '';
      renderAll();
    });

    /* 手机端触摸拖动排序（支持按住 ⠿ / 头像直接拖，或长按卡片拖动） */
    let touchDragTimer = null;
    let touchDragging = false;
    let touchSrcKey = '';
    let touchKind = '';
    let touchDestKey = '';
    let touchStartX = 0;
    let touchStartY = 0;
    let touchSrcCard = null;

    function clearTouchDragState() {
      if (touchDragTimer) { clearTimeout(touchDragTimer); touchDragTimer = null; }
      root.querySelectorAll('.is-touch-dragging, .is-drag-over').forEach(el => {
        el.classList.remove('is-touch-dragging', 'is-drag-over');
      });
      touchDragging = false;
      touchSrcKey = '';
      touchKind = '';
      touchDestKey = '';
      touchSrcCard = null;
    }

    function beginTouchDrag(card) {
      touchDragging = true;
      touchSrcCard = card;
      touchSrcKey = card.getAttribute('data-drag-key') || '';
      touchKind = card.getAttribute('data-drag-kind') || '';
      touchDestKey = '';
      card.classList.add('is-touch-dragging');
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
    }

    root.addEventListener('touchstart', (e) => {
      if (!isSortMode || isSideSlim || e.touches.length !== 1) return;
      if (e.target.closest('.gw-sort-arr')) return;
      const card = e.target.closest('[data-drag-key]');
      if (!card) return;
      clearTouchDragState();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      if (e.target.closest('.gw-drag-grip, .krs-sc-avatar, .krs-asc-icon-box')) {
        beginTouchDrag(card);
      } else {
        touchDragTimer = setTimeout(() => {
          touchDragTimer = null;
          beginTouchDrag(card);
        }, 180);
      }
    }, { passive: true });

    root.addEventListener('touchmove', (e) => {
      if (!touchDragging && !touchDragTimer) return;
      const t = e.touches[0];
      if (!t) return;
      if (!touchDragging) {
        if (Math.abs(t.clientX - touchStartX) > 8 || Math.abs(t.clientY - touchStartY) > 8) {
          clearTouchDragState();
        }
        return;
      }
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();

      const track = touchSrcCard && touchSrcCard.closest('.gw-vertical-track');
      if (track) {
        const tr = track.getBoundingClientRect();
        if (t.clientY < tr.top + 26) track.scrollTop -= 8;
        else if (t.clientY > tr.bottom - 26) track.scrollTop += 8;
      }

      const hit = document.elementFromPoint(t.clientX, t.clientY);
      const destCard = hit ? hit.closest('[data-drag-key]') : null;
      root.querySelectorAll('.is-drag-over').forEach(el => el.classList.remove('is-drag-over'));
      if (destCard && destCard.getAttribute('data-drag-kind') === touchKind) {
        const dk = destCard.getAttribute('data-drag-key') || '';
        touchDestKey = dk;
        if (dk && dk !== touchSrcKey) destCard.classList.add('is-drag-over');
      } else {
        touchDestKey = '';
      }
    }, { passive: false });

    const finishTouchDrag = () => {
      const wasDragging = touchDragging;
      const src = touchSrcKey;
      const dest = touchDestKey;
      const kind = touchKind;
      clearTouchDragState();
      if (!wasDragging) return;
      suppressTouchClick = true;
      setTimeout(() => { suppressTouchClick = false; }, 350);
      if (src && dest && dest !== src) {
        const sd = rs() || {};
        if (kind === 'char') {
          moveKeyInOrder(Object.keys(safeGet(sd, '角色', {}) || {}), 'KRS_CHAR_ORDER', src, dest);
        } else {
          const cObj = safeGet(sd, 'user.生涯', null) || safeGet(sd, 'user.资产', {}) || {};
          moveKeyInOrder(Object.keys(cObj), 'KRS_CAREER_ORDER', src, dest);
        }
        renderAll();
      }
    };

    root.addEventListener('touchend', finishTouchDrag, { passive: true });
    root.addEventListener('touchcancel', () => clearTouchDragState(), { passive: true });

    root.addEventListener('scroll', () => recordScrolls(root), { capture: true, passive: true });
  }

  function init() {
    bindEvents();
    renderAll();
    try { krsLangRefresh(); setTimeout(krsLangRefresh, 1500); } catch (_) {}
  }

  init();
  try {
    const ev = (window.parent && window.parent.eventOn) ? window.parent : (typeof eventOn === 'function' ? window : null);
    if (ev) {
      ev.eventOn('mag_variable_update_ended', renderAll);
      ev.eventOn('MAG_VARIABLE_UPDATE_ENDED', renderAll);
    }
  } catch(_) {}
})();

/* 折叠状态记忆与多面板去重 */
(function () {
  var KEY = 'KRS_STATUS_COLLAPSED';
  function want() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function sweep() {
    var list = document.querySelectorAll('.krs-status-root');
    for (var i = 0; i < list.length; i++) {
      var root = list[i];
      if (root.getAttribute('data-col-applied') !== '1') {
        root.setAttribute('data-col-applied', '1');
        var col = want();
        root.classList.toggle('krs-collapsed', col);
        var btn = root.querySelector('#krs-btn-collapse');
        if (btn) {
          btn.querySelector('.krs-collapse-text').textContent = col ? '展开' : '收起';
          btn.querySelector('.krs-collapse-icon').textContent = col ? '▼' : '▲';
        }
      }
    }
    var texts = document.querySelectorAll('.mes_text');
    for (var t = 0; t < texts.length; t++) {
      var nodes = texts[t].querySelectorAll('.krs-status-root');
      for (var j = 1; j < nodes.length; j++) {
        try { nodes[j].parentNode.removeChild(nodes[j]); } catch (e) {}
      }
    }
  }
  sweep();
  try { new MutationObserver(sweep).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
})();

/* 玩家切换 Persona 时同步头像 */
(function () {
  var last = '';
  setInterval(function () {
    try {
      var url = (typeof window.__krsUserAvatar === 'function') ? window.__krsUserAvatar() : '';
      if (!url || url === last) return;
      last = url;
      var imgs = document.querySelectorAll('.krs-status-root .hero-avatar-img');
      for (var i = 0; i < imgs.length; i++) imgs[i].setAttribute('src', url);
    } catch (e) {}
  }, 1200);
})();
</script>
