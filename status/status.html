    const STORIES = KRS_PLOT_LINES.filter(function (l) { return l.story === '事件'; });
    const EXPANSIONS = KRS_PLOT_LINES.filter(function (l) { return l.story === 'none'; });

    function paintTile(line) {
      const unknown = line._itemsOn === null;
      const on = line._itemsOn === true;
      const count = typeof line._count === 'number' ? line._count : -1;
      return '<button type="button" class="krs-plot-tile ' + (unknown ? 'unknown' : (on ? 'on' : 'off')) + '" data-ext-key="' + line.key + '"'
        + ' style="background-image:url(\'' + escHtml(line.cover || '') + '\')">'
        + '<span class="krs-plot-tile-state">' + (unknown ? '状态未知' : (on ? '已启用' : '未启用')) + '</span>'
        + '<span class="krs-plot-tile-name">' + escHtml(line.label) + '</span>'
        + '<span class="krs-plot-tile-desc">' + escHtml(line.desc || '') + '</span>'
        + '<span class="krs-plot-tile-count">' + (unknown ? '条目未知' : (count >= 0 ? count + ' 条世界书' : '条目未知')) + '</span>'
        + '</button>';
    }

    function paintExt() {
      let html = '';
      if (STORIES.length) {
        html += '<div class="krs-plot-ext-sec">◆ 可开启主线 · 角色 / 世界观 / 剧情细纲</div>';
        html += STORIES.map(paintTile).join('');
      }
      if (EXPANSIONS.length) {
        html += '<div class="krs-plot-ext-sec">◆ 联动扩展 · 仅有角色与世界观</div>';
        html += EXPANSIONS.map(paintTile).join('');
      }
      return html;
    }

    function paintStory() {
      const sd = rs() || {};
      return STORIES.map(function (line) {
        const st = krsPlotStatusOf(sd, line);
        const open = !!line._open;
        const total = line.chapters.length;
        const idx = krsPlotChapterIndex(line, st.chapter);
        const order = st.chapter === '完结' ? (total + '/' + total) : (idx >= 0 ? ((idx + 1) + '/' + total) : ('—/' + total));
        const progressIdx = (st.done || st.chapter === '完结') ? total : (idx >= 0 ? idx : 0);
        const warn = (line._itemsOn === false && !st.on)
          ? '<div class="krs-plot-warn">扩展未启用，请先到「扩展」页开启。</div>' : '';
        const stateText = st.done ? '已完结' : (st.on ? '进行中' : (st.broken ? '已破弃' : '未开启'));
        const stateCls = st.done ? 'done' : (st.on ? 'on' : 'off');
        const btnText = st.on ? '关闭剧情' : ((st.done || st.broken) ? '重新开启' : '开启剧情');
        const storyHtml = open
          ? '<div class="krs-plot-progress">' + line.chapters.map(function (c, i) {
              return '<span class="' + (i < progressIdx ? 'on' : '') + '"></span>';
            }).join('') + '</div>'
            + '<div class="krs-plot-story-top">'
            + '<span class="krs-plot-chapter-name" title="' + escHtml(krsPlotChapterTitle(line, st.chapter)) + '">' + escHtml(krsPlotChapterTitle(line, st.chapter)) + '</span>'
            + '<span class="krs-plot-chapter-order"><button type="button" data-plot-prev="' + line.key + '" title="上一章">‹</button>'
            + '<em>' + order + '</em>'
            + '<button type="button" data-plot-next="' + line.key + '" title="下一章">›</button></span>'
            + '</div>'
            + '<div class="krs-plot-stage"><b>阶段目标</b><span>' + escHtml(st.stage || '—') + '</span></div>'
            + '<div class="krs-plot-next"><b>下一步</b><span>' + escHtml(st.next || '—') + '</span></div>'
          : '';
        return '<div class="krs-plot-card ' + (open ? 'open' : '') + ' ' + stateCls + '" data-plot-card="' + line.key + '">'
          + '<button type="button" class="krs-plot-card-head" data-plot-head="' + line.key + '"'
          + ' style="background-image:url(\'' + escHtml(line.cover || '') + '\')">'
          + '<span class="krs-plot-card-name">' + escHtml(line.label) + '</span>'
          + '<span class="krs-plot-card-state">' + stateText + '</span>'
          + '<span class="krs-plot-card-arrow">' + (open ? '▾' : '▸') + '</span>'
          + '</button>'
          + '<div class="krs-plot-card-body">'
          + '<div class="krs-plot-enabled' + (st.on ? '' : ' off') + '"><span>'
          + (st.done ? '✓ 剧情已完结' : (st.on ? '✓ 剧情已开启' : (st.broken ? '✗ 剧情已破弃' : '✗ 剧情未开启')))
          + '</span><button type="button" class="krs-plot-close-story" data-plot-close-story="' + line.key + '">' + btnText + '</button></div>'
          + warn + storyHtml
          + '</div></div>';
      }).join('');
    }

    function render() {
      const body = modal.querySelector('#krs-plot-body');
      if (!body) return;
      modal.querySelectorAll('[data-plot-tab]').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-plot-tab') === tab);
      });
      body.className = 'krs-plot-body ' + (tab === 'ext' ? 'grid-ext' : 'grid-story');
      try {
        body.innerHTML = tab === 'ext' ? paintExt() : paintStory();
      } catch (err) {
        console.warn('[剧情] 渲染失败', err);
        body.innerHTML = '<div class="krs-plot-hint">渲染失败：' + escHtml(String((err && err.message) || err)) + '</div>';
      }
    }

    function applyDefaultOpen() {
      STORIES.forEach(function (line) {
        const st = krsPlotStatusOf(rs() || {}, line);
        line._open = line._itemsOn === true || st.on;
      });
    }

    async function refreshEntryState() {
      const TH = krsPlotHelper();
      entries = await krsPlotGetEntries(TH);
      KRS_PLOT_LINES.forEach(function (line) {
        const list = (entries || []).filter(function (e) {
          const c = krsEntryLabel(e);
          return line.prefixes.some(function (p) { return c.indexOf(p) === 0; });
        });
        line._entries = list;
        line._count = entries ? list.length : -1;
        line._itemsOn = entries ? list.some(function (e) { return krsEntryOn(e); }) : null;
      });
      return entries;
    }

    async function clearStoryVars(line) {
      await mutateMvuStat(function (r) {
        const ev = safeGet(r, line.event, null);
        if (!ev || typeof ev !== 'object') return;
        safeSet(r, line.event + '.状态', '破弃');
        safeSet(r, line.event + '.阶段目标', '剧情控制器已关闭这条主线。');
        safeSet(r, line.event + '.背景描述', '');
        safeSet(r, line.event + '.内容', '等待重新开启。');
      });
    }

    async function applyStory(line, target) {
      const total = line.chapters.length;
      const isFinal = target === '完结' || target === total;
      let brief;
      let status;
      let stage;
      if (isFinal) {
        brief = krsPlotFinalBrief(line);
        status = '达成';
        stage = '完结';
      } else {
        const idx = typeof target === 'number' ? target : krsPlotChapterIndex(line, target);
        const safeIdx = Math.max(0, Math.min(total - 1, idx));
        brief = krsPlotBrief(line, safeIdx);
        status = '进行中';
        stage = line.chapters[safeIdx].stage;
      }
      await mutateMvuStat(function (r) {
        const ev = safeGet(r, line.event, null);
        if (!ev) {
          safeSet(r, line.event, {
            类型: '命运',
            角色与任务: line.role,
            状态: status,
            阶段: stage,
            阶段目标: brief.goal,
            背景描述: brief.hook,
            内容: brief.content
          });
          return;
        }
        safeSet(r, line.event + '.类型', '命运');
        safeSet(r, line.event + '.角色与任务', line.role);
        safeSet(r, line.event + '.状态', status);
        safeSet(r, line.event + '.阶段', stage);
        safeSet(r, line.event + '.阶段目标', brief.goal);
        safeSet(r, line.event + '.背景描述', brief.hook);
        safeSet(r, line.event + '.内容', brief.content);
      });
    }

    async function toggleExt(line) {
      const next = line._itemsOn !== true;
      const res = await krsPlotToggleEntries(line.prefixes, next);
      if (res.ok) line._itemsOn = next;
      if (!next && res.ok && line.story === '事件') await clearStoryVars(line);
      if (hintEl) {
        hintEl.textContent = !res.ok
          ? '世界书接口不可用：条目未能同步开关。'
          : (!res.changed
            ? ('「' + line.label + '」没有匹配到条目，世界书没有改动。')
            : (next
              ? ('已启用「' + line.label + '」：' + res.changed + ' 条世界书条目已打开。')
              : ('已关闭「' + line.label + '」：' + res.changed + ' 条条目已关闭' + (line.story === '事件' ? '，其主线已标记为「破弃」。' : '。'))));
      }
      try { renderAll(); } catch (_) {}
      render();
    }

    async function openStory(line) {
      if (line._itemsOn === false) {
        if (hintEl) hintEl.textContent = '「' + line.label + '」扩展未启用，请先到「扩展」页开启。';
        return;
      }
      line._open = true;
      const st = krsPlotStatusOf(rs() || {}, line);
      let stage = line.chapters[0].stage;
      if (st.exists && st.broken && st.chapter && krsPlotChapterIndex(line, st.chapter) >= 0) {
        stage = st.chapter;
      }
      await applyStory(line, stage);
      if (hintEl) hintEl.textContent = '「' + line.label + '」剧情已开启：' + krsPlotChapterTitle(line, stage) + '。';
      try { renderAll(); } catch (_) {}
      render();
    }

    async function closeStory(line) {
      await clearStoryVars(line);
      if (hintEl) hintEl.textContent = '「' + line.label + '」剧情已关闭并标记为「破弃」；作品扩展条目保持启用。';
      try { renderAll(); } catch (_) {}
      render();
    }

    async function stepChapter(line, dir) {
      const total = line.chapters.length;
      if (!line._itemsOn) {
        if (hintEl) hintEl.textContent = '「' + line.label + '」扩展未启用，请先到「扩展」页开启。';
        return;
      }
      line._open = true;
      const st = krsPlotStatusOf(rs() || {}, line);
      let idx = st.chapter === '完结' ? total : krsPlotChapterIndex(line, st.chapter);
      if (idx < 0) idx = 0;
      const target = Math.max(0, Math.min(total, idx + dir));
      await applyStory(line, target === total ? '完结' : line.chapters[target].stage);
      if (hintEl) hintEl.textContent = '「' + line.label + '」已推进到：' + (target === total ? '完结' : line.chapters[target].title) + '。';
      try { renderAll(); } catch (_) {}
      render();
    }

    function extSummary() {
      const on = KRS_PLOT_LINES.filter(function (l) { return l._itemsOn === true; }).length;
      const active = STORIES.filter(function (l) { return krsPlotStatusOf(rs() || {}, l).on; }).length;
      return '世界书 ' + krsPlotRead.books + ' 本 · ' + krsPlotRead.entries + ' 条　｜　扩展已启用 '
        + on + ' / ' + KRS_PLOT_LINES.length + '　｜　主线进行中 ' + active + ' / ' + STORIES.length;
    }

    modal.addEventListener('click', async function (ev) {
      if (ev.target === modal || ev.target.closest('#krs-plot-close')) { modal.remove(); return; }

      const tabBtn = ev.target.closest('[data-plot-tab]');
      if (tabBtn) {
        const next = tabBtn.getAttribute('data-plot-tab');
        if (next === tab) return;
        tab = next;
        await refreshEntryState();
        if (tab === 'story') applyDefaultOpen();
        render();
        return;
      }

      const ext = ev.target.closest('[data-ext-key]');
      if (ext) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === ext.getAttribute('data-ext-key'); });
        if (line) await toggleExt(line);
        return;
      }

      const closeBtn = ev.target.closest('[data-plot-close-story]');
      if (closeBtn) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === closeBtn.getAttribute('data-plot-close-story'); });
        if (line) {
          const st = krsPlotStatusOf(rs() || {}, line);
          if (st.on) await closeStory(line); else await openStory(line);
        }
        return;
      }

      const head = ev.target.closest('[data-plot-head]');
      if (head) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === head.getAttribute('data-plot-head'); });
        if (line) { line._open = !line._open; render(); }
        return;
      }

      const p = ev.target.closest('[data-plot-prev]');
      const n = ev.target.closest('[data-plot-next]');
      if (p || n) {
        const line = KRS_PLOT_LINES.find(function (x) { return x.key === (p || n).getAttribute(p ? 'data-plot-prev' : 'data-plot-next'); });
        if (line) await stepChapter(line, p ? -1 : 1);
      }
    });

    (async function () {
      await refreshEntryState();
      if (hintEl) hintEl.textContent = entries ? extSummary() : '未找到世界书接口：剧情变量仍可推进，但扩展条目无法同步开关。';
      render();
    })();
  }


  /* ═══ 对白双语切换（世界书蓝灯 / 绿灯 + 正则联动） ═══ */
  const KRS_LANG_PREFIX = {
    zh: ['[中文-对白美化]', '[RULE]中文- 角色对话格式', '[RULE]中文-角色对话格式'],
    ja: ['[日文-对白美化]', '[RULE]日文- 角色对话格式', '[RULE]日文-角色对话格式']
  };
  const KRS_LANG_LABEL = { zh: '纯中文', ja: '中日双语' };
  const KRS_LANG_REGEX = {
    zh: '【中文 - 对白美化v2.6】',
    ja: '【中日双语·ruby版 - 对白美化v2.6】',
    off: ['【中日双语·纯中文·去除日语v2.6】', '【中日双语·ruby版 - 中文在下v2.6】']
  };
  let krsLangBusy = false;

  function krsLangMatch(name, key) {
    const text = String(name || '');
    return KRS_LANG_PREFIX[key].some(function (p) { return text.indexOf(p) >= 0; });
  }

  function krsEntryIsConstant(e) {
    if (!e || typeof e !== 'object') return false;
    if (e.strategy && typeof e.strategy.type === 'string') return e.strategy.type === 'constant';
    return e.constant === true;
  }

  function krsEntryWithConstant(e, on) {
    const out = Object.assign({}, e);
    const st = (e && e.strategy && typeof e.strategy === 'object') ? Object.assign({}, e.strategy) : {};
    const wasVectorized = st.type === 'vectorized';
    st.type = on ? 'constant' : (wasVectorized ? 'vectorized' : 'selective');
    out.strategy = st;
    out.constant = on;
    out.enabled = true;
    return out;
  }

  function krsGlobalFn(name) {
    const scopes = [window, window.parent, window.top];
    for (let i = 0; i < scopes.length; i++) {
      const sc = scopes[i];
      try { if (sc && typeof sc[name] === 'function') return sc[name].bind(sc); } catch (_) {}
      try { if (sc && sc.TavernHelper && typeof sc.TavernHelper[name] === 'function') return sc.TavernHelper[name].bind(sc.TavernHelper); } catch (_) {}
    }
    return null;
  }

  function krsRegexListOf(raw) {
    if (Array.isArray(raw)) return raw;
    if (raw && Array.isArray(raw.regexes)) return raw.regexes;
    return null;
  }

  async function krsRegexState() {
    const get = krsGlobalFn('getTavernRegexes');
    if (typeof get !== 'function') return { available: false, zh: false, ja: false };
    try {
      const raw = await Promise.resolve(get({ type: 'character' }));
      const list = krsRegexListOf(raw);
      if (!list) return { available: false, zh: false, ja: false };
      const state = { available: true, zh: false, ja: false };
      list.forEach(function (r) {
        const name = String(r.script_name || r.scriptName || r.name || '');
        if (name.indexOf(KRS_LANG_REGEX.zh) >= 0) state.zh = !!r.enabled;
        if (name.indexOf(KRS_LANG_REGEX.ja) >= 0) state.ja = !!r.enabled;
      });
      return state;
    } catch (_) { return { available: false, zh: false, ja: false }; }
  }

  async function krsRegexSet(target) {
    const update = krsGlobalFn('updateTavernRegexesWith');
    if (typeof update !== 'function') return { ok: false, available: false, err: '没有正则写入接口' };
    try {
      await Promise.resolve(update(function (regexes) {
        const list = krsRegexListOf(regexes);
        if (!list) return regexes;
        return list.map(function (r) {
          const name = String(r.script_name || r.scriptName || r.name || '');
          if (name.indexOf(KRS_LANG_REGEX.zh) >= 0) return Object.assign({}, r, { enabled: target === 'zh' });
          if (name.indexOf(KRS_LANG_REGEX.ja) >= 0) return Object.assign({}, r, { enabled: target === 'ja' });
          if (KRS_LANG_REGEX.off.some(function (p) { return name.indexOf(p) >= 0; })) return Object.assign({}, r, { enabled: false });
          return r;
        });
      }, { type: 'character' }));
      return { ok: true, available: true, err: '' };
    } catch (e) { return { ok: false, available: true, err: String((e && e.message) || e) }; }
  }

  async function krsLangScan() {
    const res = { found: false, zhGreen: false, jaGreen: false, regexAvailable: false, zhRegex: false, jaRegex: false, matchedBooks: [] };
    const TH = krsPlotHelper();
    if (TH && typeof TH.getWorldbook === 'function') {
      const names = await krsPlotBookNames(TH);
      for (let i = 0; i < names.length; i++) {
        let raw = null;
        try { raw = await Promise.resolve(TH.getWorldbook(names[i])); } catch (_) { continue; }
        let hit = false;
        krsFlattenEntries(raw).forEach(function (e) {
          const c = String(e.comment || e.name || '');
          const on = e.enabled !== false;
          if (krsLangMatch(c, 'zh')) { res.found = true; hit = true; if (on && krsEntryIsConstant(e)) res.zhGreen = true; }
          if (krsLangMatch(c, 'ja')) { res.found = true; hit = true; if (on && krsEntryIsConstant(e)) res.jaGreen = true; }
        });
        if (hit && res.matchedBooks.indexOf(names[i]) < 0) res.matchedBooks.push(names[i]);
      }
    }
    const rx = await krsRegexState();
    res.regexAvailable = rx.available;
    res.zhRegex = rx.zh;
    res.jaRegex = rx.ja;
    return res;
  }

  function krsLangModeOf(r) {
    if (!r || !r.found) return '';
    if (r.jaGreen && !r.zhGreen) return 'ja';
    return 'zh';
  }

  async function krsLangApply(target, preScan) {
    const TH = krsPlotHelper();
    if (!TH) return { ok: false, err: 'TavernHelper 不可用' };
    const names = (preScan && preScan.matchedBooks && preScan.matchedBooks.length)
      ? preScan.matchedBooks
      : await krsPlotBookNames(TH);
    if (!names.length) return { ok: false, err: '没有找到世界书' };
    const errs = [];
    let wrote = false;
    for (let i = 0; i < names.length; i++) {
      if (typeof TH.updateWorldbookWith !== 'function') continue;
      try {
        await Promise.resolve(TH.updateWorldbookWith(names[i], function (entries) {
          return krsFlattenEntries(entries).map(function (e) {
            const c = String(e.comment || e.name || '');
            const isZh = krsLangMatch(c, 'zh');
            const isJa = krsLangMatch(c, 'ja');
            if (!isZh && !isJa) return e;
            return krsEntryWithConstant(e, isZh ? target === 'zh' : target === 'ja');
          });
        }));
        wrote = true;
      } catch (e) { errs.push(String((e && e.message) || e)); }
    }
    if (!wrote) errs.push('世界书写入失败');

    /* ▼ 方案 A（不重载面板）：保持下面这 4 行注释；若选方案 B（自动切正则但会重载面板），请取消这 4 行注释 ▼ */
    // const rr = await krsRegexSet(target);
    // if (!rr.ok && rr.available) errs.push(rr.err);

    let scan = null;
    try { scan = await krsLangScan(); } catch (_) {}
    const mode = krsLangModeOf(scan || {});
    // 方案 B 时把下一行改成：const regexOK = !scan || !scan.regexAvailable || (target === 'zh' ? (scan.zhRegex && !scan.jaRegex) : (scan.jaRegex && !scan.zhRegex));
    const regexOK = true;
    if (mode === target && regexOK) return { ok: true, err: '' };
    return { ok: false, err: errs.join(' | ') || ('写入后状态仍是 ' + (mode || '未知')) };
  }

  async function krsLangRefresh() {
    const buttons = Array.from(document.querySelectorAll('.krs-lang-switch'));
    if (!buttons.length) return;
    let scan = null;
    try { scan = await krsLangScan(); } catch (_) {}
    const mode = krsLangModeOf(scan || {});
    buttons.forEach(function (btn) {
      btn.setAttribute('data-mode', mode || 'err');
      const txt = btn.querySelector('.krs-lang-text');
      if (txt) txt.textContent = (scan && scan.found) ? (KRS_LANG_LABEL[mode] || '纯中文') : '未找到';
      btn.title = (scan && scan.found)
        ? (mode === 'ja' ? '当前：中日双语（日文条目常驻）→ 点击切回纯中文' : '当前：纯中文（中文条目常驻）→ 点击切到中日双语')
        : '没找到 [RULE]中文/日文- 角色对话格式 条目';
    });
  }

  async function krsLangToggle() {
    if (krsLangBusy) return;
    krsLangBusy = true;
    const buttons = Array.from(document.querySelectorAll('.krs-lang-switch'));
    buttons.forEach(function (b) { b.classList.add('busy'); });
    try {
      const scan = await krsLangScan();
      if (!scan.found) {
        buttons.forEach(function (b) {
          b.setAttribute('data-mode', 'err');
          const t = b.querySelector('.krs-lang-text');
          if (t) t.textContent = '未找到';
        });
        console.warn('[对白语言] 世界书里没有 [RULE]中文/日文- 角色对话格式 条目');
        return;
      }
      const cur = krsLangModeOf(scan);
      const target = cur === 'zh' ? 'ja' : 'zh';
      const res = await krsLangApply(target, scan);
      if (!res.ok) {
        buttons.forEach(function (b) {
          b.setAttribute('data-mode', 'err');
          const t = b.querySelector('.krs-lang-text');
          if (t) t.textContent = '切换失败';
          b.title = '切换失败：' + res.err;
        });
        console.warn('[对白语言] 切换失败：', res.err);
      }
    } catch (e) {
      console.warn('[对白语言] 异常：', e);
    } finally {
      krsLangBusy = false;
      buttons.forEach(function (b) { b.classList.remove('busy'); });
      try { await krsLangRefresh(); } catch (_) {}
    }
  }

  let mapInitDone = false;
  window.initEmbeddedMap = function () {
    if (mapInitDone) return;
    mapInitDone = true;

    const viewport = document.getElementById('pdr-viewport');
    const canvas = document.getElementById('pdr-canvas');
    const nodesLayer = document.getElementById('pdr-nodes-layer');
    const svgLines = document.getElementById('pdr-svg-lines');
    const factionsLayer = document.getElementById('pdr-factions-layer');
    if (!viewport || !canvas || !nodesLayer) return;

    factionsLayer.innerHTML = KUMOMI_MAP_DATA.factions.map(f => `
      <div class="pdr-faction-zone" style="left:${f.x}px; top:${f.y}px; width:${f.w}px; height:${f.h}px; background:${f.color}; border:1.5px dashed ${f.border};">
        <span class="pdr-faction-watermark-cn" style="color:${f.border}">${escHtml(f.cn)}</span>
        <span class="pdr-faction-watermark-en" style="color:${f.border}">${escHtml(f.en)}</span>
      </div>
    `).join('');

    const nodeMap = new Map();
    KUMOMI_MAP_DATA.nodes.forEach(n => nodeMap.set(n.id, n));

    let svgHtml = '';
    KUMOMI_MAP_DATA.connections.forEach(c => {
      const f = nodeMap.get(c.from), t = nodeMap.get(c.to);
      if (f && t) svgHtml += `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" class="${c.type}"></line>`;
    });

    nodesLayer.innerHTML = '';
    KUMOMI_MAP_DATA.nodes.forEach(n => {
      const nodeEl = document.createElement('div');
      nodeEl.className = 'pdr-node';
      nodeEl.style.left = `${n.x}px`;
      nodeEl.style.top = `${n.y}px`;
      nodeEl.innerHTML = `<div class="pdr-node-icon-box">${n.icon}</div><span class="pdr-node-label">${escHtml(n.name)}</span>`;
      nodeEl.onclick = (e) => { e.stopPropagation(); selectLocation(n.id); };
      nodesLayer.appendChild(nodeEl);

      if (n.subs && n.subs.length) {
        const radius = 108;
        const total = n.subs.length;
        const baseRad = (n.fanAngle || 90) * (Math.PI / 180);
        const spread = Math.min(Math.PI * 0.8, total * 0.3 * Math.PI);
        n.subs.forEach((subName, idx) => {
          const offset = total > 1 ? (idx / (total - 1) - 0.5) * spread : 0;
          const ang = baseRad + offset;
          const sx = n.x + Math.cos(ang) * radius;
          const sy = n.y + Math.sin(ang) * radius;
          svgHtml += `<line x1="${n.x}" y1="${n.y}" x2="${sx}" y2="${sy}" class="sub-link"></line>`;
          const subEl = document.createElement('div');
          subEl.className = 'pdr-subnode';
          subEl.style.left = `${sx}px`;
          subEl.style.top = `${sy}px`;
          subEl.innerHTML = `<span>▫</span><span>${escHtml(subName)}</span>`;
          subEl.onclick = (e) => { e.stopPropagation(); selectLocation(n.id, subName); };
          nodesLayer.appendChild(subEl);
        });
      }
    });
    svgLines.innerHTML = svgHtml;

    function selectLocation(nodeId, subName) {
      const node = nodeMap.get(nodeId);
      if (!node) return;
      document.getElementById('pdr-info-name').textContent = subName ? `${node.name} · ${subName}` : node.name;
      document.getElementById('pdr-info-nation').textContent = node.nation;
      document.getElementById('pdr-info-type').textContent = node.type;
      document.getElementById('pdr-info-desc').textContent = node.desc;
      document.getElementById('pdr-info-cost').textContent = node.cost;
      const subsBox = document.getElementById('pdr-info-subs');
      if (subsBox) {
        subsBox.innerHTML = (node.subs || []).map(s => `
          <span class="pdr-sub-pill ${s === subName ? 'selected' : ''}" onclick="window.selectPandoraSub('${node.id}', '${s}')">${escHtml(s)}</span>
        `).join('');
      }
      document.getElementById('pdr-btn-set-loc').onclick = async () => {
        const targetLoc = subName ? `${node.name}·${subName}` : node.name;
        await mutateMvuStat(r => { if (!r['世界']) r['世界'] = {}; r['世界']['地点'] = targetLoc; });
        renderAll();
      };
    }
    window.selectPandoraSub = (p, s) => selectLocation(p, s);

    let scale = 0.58;
    const vRect = viewport.getBoundingClientRect();
    const vW = vRect.width || 880;
    const vH = vRect.height || 520;
    let panX = (vW / 2) - (1300 * scale);
    let panY = (vH / 2) - (820 * scale);

    function update() { canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

    let sx = 0, sy = 0, dragMoved = 0;
    const ptrs = new Map();
    viewport.onpointerdown = (e) => {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      dragMoved = 0;
      sx = e.clientX - panX;
      sy = e.clientY - panY;
    };
    window.addEventListener('pointermove', (e) => {
      if (!ptrs.has(e.pointerId)) return;
      dragMoved = Math.max(dragMoved, Math.abs(e.clientX - (sx + panX)) + Math.abs(e.clientY - (sy + panY)));
      panX = e.clientX - sx;
      panY = e.clientY - sy;
      update();
    });
    window.addEventListener('pointerup', (e) => ptrs.delete(e.pointerId));
    window.addEventListener('pointercancel', (e) => ptrs.delete(e.pointerId));
    viewport.addEventListener('click', (e) => { if (dragMoved > 8) { e.stopPropagation(); e.preventDefault(); } dragMoved = 0; }, true);

    viewport.onwheel = (e) => {
      e.preventDefault();
      const old = scale;
      scale = e.deltaY < 0 ? Math.min(1.6, scale * 1.14) : Math.max(0.32, scale / 1.14);
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      panX = mx - (mx - panX) * (scale / old);
      panY = my - (my - panY) * (scale / old);
      update();
    };

    document.getElementById('pdr-zoom-in').onclick = () => { scale = Math.min(1.6, scale * 1.2); update(); };
    document.getElementById('pdr-zoom-out').onclick = () => { scale = Math.max(0.32, scale / 1.2); update(); };
    document.getElementById('pdr-zoom-reset').onclick = () => {
      scale = 0.58;
      panX = (vW / 2) - (1300 * scale);
      panY = (vH / 2) - (820 * scale);
      update();
    };
    update();
    selectLocation("云下学园·中枢");
  };

  /* ═══ 事件绑定 ═══ */
  function bindEvents() {
    const root = document.querySelector('.krs-status-root');
    if (!root || root.dataset.bound) return;
    root.dataset.bound = 'true';

    try {
      if (localStorage.getItem('KRS_STATUS_DARK') === '1') {
        root.classList.add('krs-dark');
        const tb = root.querySelector('#krs-btn-theme');
        if (tb) {
          tb.querySelector('.theme-icon').textContent = '☀️';
          tb.querySelector('.theme-text').textContent = '亮色';
        }
      }
    } catch (_) {}

    root.addEventListener('click', async (e) => {
      const themeBtn = e.target.closest('#krs-btn-theme');
      if (themeBtn) {
        const isDark = root.classList.toggle('krs-dark');
        themeBtn.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
        themeBtn.querySelector('.theme-text').textContent = isDark ? '明' : '暗';
        try { localStorage.setItem('KRS_STATUS_DARK', isDark ? '1' : '0'); } catch (_) {}
        return;
      }

      if (e.target.closest('[data-Switch-tab="map"]')) {
        activeTab = 'map';
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'map'));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-map'));
        if (window.initEmbeddedMap) window.initEmbeddedMap();
        return;
      }

      try {
        if (localStorage.getItem('KRS_SIDE_SLIM') === '1' && !isSideSlim) {
          isSideSlim = true;
          root.querySelectorAll('.gw-master-detail').forEach(el => el.classList.add('is-slim'));
        }
      } catch (_) {}

      if (e.target.closest('[data-open-tuner]')) { e.stopPropagation(); isTunerOpen = true; renderAll(); return; }
      if (e.target.closest('[data-close-tuner]')) { e.stopPropagation(); isTunerOpen = false; renderAll(); return; }
      if (e.target.closest('.gw-sprite-tuner')) { e.stopPropagation(); return; }

      if (e.target.closest('[data-toggle-sort]')) {
        isSortMode = !isSortMode;
        renderAll();
        return;
      }

      const moveCharBtn = e.target.closest('[data-move-char]');
      if (moveCharBtn) {
        e.stopPropagation();
        const sd = rs() || {};
        moveKeyInOrder(Object.keys(safeGet(sd, '角色', {}) || {}), 'KRS_CHAR_ORDER', moveCharBtn.getAttribute('data-move-char'), parseInt(moveCharBtn.getAttribute('data-dir')));
        renderAll(); return;
      }

      const moveCareerBtn = e.target.closest('[data-move-career]');
      if (moveCareerBtn) {
        e.stopPropagation();
        const sd = rs() || {};
        const cObj = safeGet(sd, 'user.生涯', null) || safeGet(sd, 'user.资产', {}) || {};
        moveKeyInOrder(Object.keys(cObj), 'KRS_CAREER_ORDER', moveCareerBtn.getAttribute('data-move-career'), parseInt(moveCareerBtn.getAttribute('data-dir')));
        renderAll(); return;
      }

      if (e.target.closest('[data-toggle-slim]')) {
        isSideSlim = !isSideSlim;
        root.querySelectorAll('.gw-master-detail').forEach(el => el.classList.toggle('is-slim', isSideSlim));
        try { localStorage.setItem('KRS_SIDE_SLIM', isSideSlim ? '1' : '0'); } catch (_) {}
        return;
      }

      const calDay = e.target.closest('[data-cal-day]');
      if (calDay) { calSelectedDate = calDay.getAttribute('data-cal-day'); renderAll(); return; }

      const calNav = e.target.closest('[data-cal-nav]');
      if (calNav) {
        calViewMonth += parseInt(calNav.getAttribute('data-cal-nav'));
        if (calViewMonth > 12) { calViewMonth = 1; calViewYear++; }
        if (calViewMonth < 1) { calViewMonth = 12; calViewYear--; }
        renderAll(); return;
      }

      const calToday = e.target.closest('[data-cal-goto-today]');
      if (calToday) {
        const tk = calToday.getAttribute('data-cal-goto-today');
        const p = tk.split('-').map(Number);
        calViewYear = p[0]; calViewMonth = p[1]; calSelectedDate = tk;
        renderAll(); return;
      }

      const calMode = e.target.closest('[data-cal-mode]');
      if (calMode) { calSubMode = calMode.getAttribute('data-cal-mode'); renderAll(); return; }

      const delCal = e.target.closest('[data-del-cal]');
      if (delCal) {
        const cid = delCal.getAttribute('data-del-cal');
        await mutateMvuStat(r => { if (r['世界'] && r['世界']['日历']) delete r['世界']['日历'][cid]; });
        renderAll(); return;
      }

      if (e.target.closest('#gw-btn-add-promise')) {
        const p = (calSelectedDate || '2018-04-09').split('-').map(Number);
        const defDate = `${p[0]}年${p[1]}月${p[2]}日`;
        const title = prompt('请输入新约定名称（4~12字，如：六月恋友竞赛）：');
        if (!title || !title.trim()) return;
        const content = prompt('请输入约定内容与判定条件：', '') || '双方约定的事项';
        const who = prompt('请输入相关者（如：美月×零）：', '零') || '零';
        const deadline = prompt('请输入约定日期：', defDate) || defDate;
        await mutateMvuStat(r => {
          if (!r['世界']) r['世界'] = {};
          if (!r['世界']['事件']) r['世界']['事件'] = {};
          r['世界']['事件'][title.trim()] = { 类型: '约定', 内容: content.trim(), 相关者: who.trim(), 期限: deadline.trim(), 状态: '进行中' };
        });
        renderAll(); return;
      }

      if (e.target.closest('.krs-plot-hub-btn')) { openPlotPanel(); return; }
      if (e.target.closest('.krs-lang-switch')) { await krsLangToggle(); return; }
      if (e.target.closest('.cg-hub-btn')) { openCgGalleryModal(null); return; }

      const heroCgBtn = e.target.closest('.cg-hero-btn');
      if (heroCgBtn) { openCgGalleryModal(heroCgBtn.getAttribute('data-cg-char') || activeCharName); return; }

      const jumpCareer = e.target.closest('[data-jump-career]');

        activeAssetName = jumpCareer.getAttribute('data-jump-career');
        activeAssetCat = '全部';
        activeTab = 'assets';
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'assets'));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-assets'));
        renderAll();
        return;
      }

      const tabBtn = e.target.closest('.krs-nav-tab');
      if (tabBtn) {
        activeTab = tabBtn.getAttribute('data-tab');
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b === tabBtn));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${activeTab}`));
        if (activeTab === 'map' && window.initEmbeddedMap) window.initEmbeddedMap();
        return;

      const scCard = e.target.closest('[data-select-char]');
      if (scCard) { activeCharName = scCard.getAttribute('data-select-char'); renderAll(); return; }

      const catBtn = e.target.closest('[data-asset-cat]');
      if (catBtn) { activeAssetCat = catBtn.getAttribute('data-asset-cat'); renderAll(); return; }

      const saCard = e.target.closest('[data-select-asset]');
      if (saCard) { activeAssetName = saCard.getAttribute('data-select-asset'); renderAll(); return; }

      const editBtn = e.target.closest('.edit-toggle-btn');
      if (editBtn) {
        isEditMode = !isEditMode;
        renderAll();
        return;
      }

      if (isEditMode) {
        const editField = e.target.closest('[data-krs-edit]');
        if (editField) {
          e.preventDefault();
          e.stopImmediatePropagation();
          openEditor(
            editField.getAttribute('data-krs-edit'),
            editField.getAttribute('data-krs-label') || '变量',
            editField.getAttribute('data-krs-type') || 'text'
          );
          return;

        if (openEventItemKeys.has(k)) openEventItemKeys.delete(k);
        else openEventItemKeys.add(k);
        wrap.classList.toggle('open');
        return;
      }

      const delChar = e.target.closest('[data-del-char]');
      if (delChar) {
        const target = delChar.getAttribute('data-del-char');
        if (confirm(`确定清退角色【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['角色']) delete r['角色'][target]; });
          activeCharName = '';
          renderAll();
        }
        return;
      }

      const delEv = e.target.closest('[data-del-event]');
      if (delEv) {
        const target = delEv.getAttribute('data-del-event');
        if (confirm(`确定清退事件【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['世界'] && r['世界']['事件']) delete r['世界']['事件'][target]; });
          renderAll();
        }
        return;
      }

      const delAsset = e.target.closest('[data-del-asset]');
      if (delAsset) {
        const target = delAsset.getAttribute('data-del-asset');
        if (confirm(`确定清退生涯【${target}】吗？`)) {
          await mutateMvuStat(r => {
            if (r['user'] && r['user']['生涯']) delete r['user']['生涯'][target];
            if (r['user'] && r['user']['资产']) delete r['user']['资产'][target];
          });
          activeAssetName = '';
          renderAll();
        }
        return;
      }

      const colBtn = e.target.closest('#krs-btn-collapse');
      if (colBtn) {
        const isCol = root.classList.toggle('krs-collapsed');
        colBtn.querySelector('.krs-collapse-text').textContent = isCol ? '展开' : '收起';
        colBtn.querySelector('.krs-collapse-icon').textContent = isCol ? '▼' : '▲';
        try { localStorage.setItem('KRS_STATUS_COLLAPSED', isCol ? '1' : '0'); } catch (_) {}
      }
    });

    root.addEventListener('dragstart', (e) => {
      const card = e.target.closest('[data-drag-key]');
      if (!card || !isSortMode) return;
      dragSrcKey = card.getAttribute('data-drag-key');
      dragKind = card.getAttribute('data-drag-kind');
    });
    root.addEventListener('dragover', (e) => {
      if (isSortMode && e.target.closest('[data-drag-key]')) e.preventDefault();
    });
    root.addEventListener('drop', (e) => {
      const targetCard = e.target.closest('[data-drag-key]');
      if (!targetCard || !isSortMode || !dragSrcKey) return;
      const destKey = targetCard.getAttribute('data-drag-key');
      const kind = targetCard.getAttribute('data-drag-kind');
      if (kind !== dragKind || destKey === dragSrcKey) return;
      const sd = rs() || {};
      if (kind === 'char') {
        moveKeyInOrder(Object.keys(safeGet(sd, '角色', {}) || {}), 'KRS_CHAR_ORDER', dragSrcKey, destKey);
      } else {
        const cObj = safeGet(sd, 'user.生涯', null) || safeGet(sd, 'user.资产', {}) || {};
        moveKeyInOrder(Object.keys(cObj), 'KRS_CAREER_ORDER', dragSrcKey, destKey);
      }
      dragSrcKey = '';
      renderAll();
    });

    root.addEventListener('scroll', () => recordScrolls(root), { capture: true, passive: true });
  }

  function init() {
    bindEvents();
    renderAll();
    try { krsLangRefresh(); setTimeout(krsLangRefresh, 1500); } catch (_) {}
  }

  init();
  try {
    const ev = (window.parent && window.parent.eventOn) ? window.parent : (typeof eventOn === 'function' ? window : null);
    if (ev) {
      ev.eventOn('mag_variable_update_ended', renderAll);
      ev.eventOn('MAG_VARIABLE_UPDATE_ENDED', renderAll);
    }
  } catch(_) {}
})();

/* 折叠状态记忆与多面板去重 */
(function () {
  var KEY = 'KRS_STATUS_COLLAPSED';
  function want() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function sweep() {
    var list = document.querySelectorAll('.krs-status-root');
    for (var i = 0; i < list.length; i++) {
      var root = list[i];
      if (root.getAttribute('data-col-applied') !== '1') {
        root.setAttribute('data-col-applied', '1');
        var col = want();
        root.classList.toggle('krs-collapsed', col);
        var btn = root.querySelector('#krs-btn-collapse');
        if (btn) {
          btn.querySelector('.krs-collapse-text').textContent = col ? '展开' : '收起';
          btn.querySelector('.krs-collapse-icon').textContent = col ? '▼' : '▲';
        }
      }
    }
    var texts = document.querySelectorAll('.mes_text');
    for (var t = 0; t < texts.length; t++) {
      var nodes = texts[t].querySelectorAll('.krs-status-root');
      for (var j = 1; j < nodes.length; j++) {
        try { nodes[j].parentNode.removeChild(nodes[j]); } catch (e) {}
      }
    }
  }
  sweep();
  try { new MutationObserver(sweep).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
})();

/* 玩家切换 Persona 时同步头像 */
(function () {
  var last = '';
  setInterval(function () {
    try {
      var url = (typeof window.__krsUserAvatar === 'function') ? window.__krsUserAvatar() : '';
      if (!url || url === last) return;
      last = url;
      var imgs = document.querySelectorAll('.krs-status-root .hero-avatar-img');
      for (var i = 0; i < imgs.length; i++) imgs[i].setAttribute('src', url);
    } catch (e) {}
  }, 1200);
})();
</script>
